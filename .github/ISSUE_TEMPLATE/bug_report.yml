name: Bug report
description: Report a problem with the Tech Tinker Club website or a supporting club tool.
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tech Tinker Club website/content
        - Curriculum / lesson content
        - Tools / tutorials
        - Supporting app or project
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it appeared.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page, activity or settings involved when relevant.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Edge on Windows 11
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or other notes
      description: Screenshots are especially useful for layout issues.
    validations:
      required: false
