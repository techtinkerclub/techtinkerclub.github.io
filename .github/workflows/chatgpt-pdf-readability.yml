name: ChatGPT PDF readability patch

on:
  push:
    branches:
      - chatgpt/v1.31.4-pdf-text-readability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-readability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply readability pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/99club/games-pdf.js')
          s = path.read_text(encoding='utf-8')
          before = s

          def replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected source block: {label}')
              s = s.replace(old, new, 1)

          replace(
              ' * v1.6.0 — mixed-difficulty packs + vocabulary layout refinements.',
              ' * v1.6.1 — print readability pass for instructions, clues and question text.',
              'version banner')

          old_helpers = '''  function drawWrapped(page,x,y,text,maxWidth,size,opts={}){\n    const lines=wrap(text,maxWidth,size,!!opts.bold),lh=opts.lineHeight||size*1.22,max=opts.maxLines||999;\n    lines.slice(0,max).forEach((line,i)=>page.text(x,y+i*lh,line,size,opts));\n    return Math.min(lines.length,max)*lh;\n  }\n  function fitText(page,x,y,text,maxWidth,size,opts={}){\n    let s=size;while(s>4.5&&P.estimateTextWidth(clean(text),s,!!opts.bold)>maxWidth)s-=.25;\n    page.text(x,y,text,s,opts);return s;\n  }'''
          new_helpers = '''  function readableProseSize(text,size,opts={}){\n    const original=Number(size)||0,value=clean(text);\n    if(opts.compact||original>=8.7||!/[A-Za-z]/.test(value))return original;\n    const words=value.trim().split(/\\s+/).filter(Boolean);\n    if(words.length<2&&value.length<9)return original;\n    if(original<5.5)return 7.6;\n    if(original<6.5)return 8.0;\n    if(original<7.5)return 8.4;\n    return 8.6;\n  }\n  function drawWrapped(page,x,y,text,maxWidth,size,opts={}){\n    size=readableProseSize(text,size,opts);\n    const lines=wrap(text,maxWidth,size,!!opts.bold),lh=opts.lineHeight||size*1.22,max=opts.maxLines||999;\n    lines.slice(0,max).forEach((line,i)=>page.text(x,y+i*lh,line,size,opts));\n    return Math.min(lines.length,max)*lh;\n  }\n  function fitText(page,x,y,text,maxWidth,size,opts={}){\n    const original=Number(size)||0;size=readableProseSize(text,size,opts);\n    const floor=size>original?6.8:4.5;let s=size;while(s>floor&&P.estimateTextWidth(clean(text),s,!!opts.bold)>maxWidth)s-=.25;\n    page.text(x,y,text,s,opts);return s;\n  }'''
          replace(old_helpers, new_helpers, 'readable prose helpers')

          replace(
              '''    page.text(x+12,y+18,`ACTIVITY ${index}`,7,{bold:true,color:MUTED});\n    page.text(x+12,y+37,clean(a.title||'Activity'),13,{bold:true,color:INK});\n    page.text(x+w-12,y+19,cap(a.difficulty||''),7,{color:MUTED,align:'right'});''',
              '''    page.text(x+12,y+18,`ACTIVITY ${index}`,8.4,{bold:true,color:MUTED});\n    page.text(x+12,y+37,clean(a.title||'Activity'),14,{bold:true,color:INK});\n    page.text(x+w-12,y+19,cap(a.difficulty||''),8.4,{color:MUTED,align:'right'});''',
              'activity header sizes')

          old_wordsearch = '''    let cy=bodyY+2,fs=h<220?5.2:h<360?5.7:6.3,lh=fs*1.22;\n    const entries=a.placements||[];\n    for(let i=0;i<entries.length;i++){\n      const p=entries[i],label=a.mode==='definitions'?`${i+1}. ${p.definition}${needsEnumeration(p.term)?` ${enumeration(p.term)}`:''}`:`${i+1}. ${p.term} — ${p.definition}`;\n      const lines=wrap(label,rightW,fs,false).slice(0,h<220?2:3);\n      for(const line of lines){if(cy+lh>y+h-15)break;page.text(rightX,cy,line,fs,{color:DARK});cy+=lh;}\n      cy+=1.5;if(cy>y+h-15)break;\n    }'''
          new_wordsearch = '''    const entries=a.placements||[],maxPer=h<220?2:3,labels=entries.map((p,i)=>a.mode==='definitions'?`${i+1}. ${p.definition}${needsEnumeration(p.term)?` ${enumeration(p.term)}`:''}`:`${i+1}. ${p.term} — ${p.definition}`),availTextH=Math.max(40,y+h-17-(bodyY+2));\n    let fs=h<220?7.2:h<360?8.0:8.6;\n    const needed=size=>labels.reduce((sum,label)=>sum+Math.min(maxPer,wrap(label,rightW,size,false).length)*(size*1.18)+1.5,0);\n    while(fs>6.8&&needed(fs)>availTextH)fs-=.2;\n    const lh=fs*1.18;let cy=bodyY+2;\n    for(let i=0;i<entries.length;i++){\n      const lines=wrap(labels[i],rightW,fs,false).slice(0,maxPer);\n      for(const line of lines){if(cy+lh>y+h-15)break;page.text(rightX,cy,line,fs,{color:DARK});cy+=lh;}\n      cy+=1.5;if(cy>y+h-15)break;\n    }'''
          replace(old_wordsearch, new_wordsearch, 'word-search definition sizing')

          replace(
              '''    let fs=h<220?5.0:h<360?5.7:6.8;while(fs>4.1&&bodyY+3+neededHeight(fs)>maxY)fs-=.2;const lh=fs*1.18;let cy=bodyY+3;''',
              '''    let fs=h<220?7.2:h<360?8.0:8.8;while(fs>6.8&&bodyY+3+neededHeight(fs)>maxY)fs-=.2;const lh=fs*1.18;let cy=bodyY+3;''',
              'crossword clue sizing')

          replace(
              '''    const qx=x+gridAvailW+22,qw=w-gridAvailW-35;page.text(qx,bodyY+7,'Questions',6.2,{bold:true,color:DARK});\n    const noteH=8,usableQH=Math.max(32,bodyH-22-noteH),qh=usableQH/Math.max(1,a.steps.length),qfs=Math.max(3.5,Math.min(5.4,qh*.48));let cy=bodyY+14;''',
              '''    const qx=x+gridAvailW+22,qw=w-gridAvailW-35;page.text(qx,bodyY+8,'Questions',8.5,{bold:true,color:DARK});\n    const noteH=10,usableQH=Math.max(32,bodyH-24-noteH),qh=usableQH/Math.max(1,a.steps.length),qfs=Math.max(7.0,Math.min(8.5,qh*.42));let cy=bodyY+18;''',
              'maze question sizing')
          replace(
              '''    page.text(qx,bodyY+bodyH-2,answers?'Highlighted cells = route':'Only up / down / left / right',Math.max(3.6,Math.min(4.4,qfs)),{color:MUTED});''',
              '''    page.text(qx,bodyY+bodyH-2,answers?'Highlighted cells = route':'Only up / down / left / right',Math.max(6.8,Math.min(7.6,qfs)),{color:MUTED});''',
              'maze note sizing')

          old_crossnumber = '''    groups.forEach(([label,list],gi)=>{const xx=rx+gi*(cw+cgap);page.text(xx,bodyY+5,label,6.2,{bold:true,color:[46,87,86]});const usable=bodyH-12,rowH=Math.max(7.5,usable/Math.max(1,list.length)),fs=Math.max(3.8,Math.min(5.25,rowH*.55));let cy=bodyY+14;for(const e of list){drawWrapped(page,xx,cy,`${e.number}. ${e.clue}`,cw,fs,{color:DARK,lineHeight:fs*1.08,maxLines:2});cy+=rowH;if(cy>bodyY+bodyH-4)break;}});'''
          new_crossnumber = '''    groups.forEach(([label,list],gi)=>{const xx=rx+gi*(cw+cgap);page.text(xx,bodyY+7,label,8.4,{bold:true,color:[46,87,86]});const usable=bodyH-16,rowH=Math.max(12,usable/Math.max(1,list.length)),fs=Math.max(6.6,Math.min(8.4,rowH*.43));let cy=bodyY+18;for(const e of list){drawWrapped(page,xx,cy,`${e.number}. ${e.clue}`,cw,fs,{color:DARK,lineHeight:fs*1.08,maxLines:2,compact:true});cy+=rowH;if(cy>bodyY+bodyH-4)break;}});'''
          replace(old_crossnumber, new_crossnumber, 'crossnumber clue sizing')

          replace(
              '''    const rx=x+12+leftW+gap,rw=w-24-leftW-gap,list=a.placements||[],rowH=Math.max(10,Math.min(18,bodyH/Math.max(1,list.length))),fs=Math.max(4.3,Math.min(5.8,rowH*.38));''',
              '''    const rx=x+12+leftW+gap,rw=w-24-leftW-gap,list=a.placements||[],rowH=Math.max(12,Math.min(20,bodyH/Math.max(1,list.length))),fs=Math.max(6.8,Math.min(8.2,rowH*.48));''',
              'number-search question sizing')

          old_function = '''  function drawFunctionMachine(page,a,answers,x,y,w,h,index){const top=activityFrame(page,x,y,w,h,index,a);drawWrapped(page,x+12,top,a.instruction,w-24,6.5,{color:MUTED,maxLines:2});const rule=a.operations.map(o=>`${o.op} ${o.value}`).join(' -> ');page.text(x+w/2,top+34,clean(`INPUT -> ${rule} -> OUTPUT`),7.2,{bold:true,color:TEAL,align:'center'});const tableW=Math.min(260,w*.62),tx=x+w/2-tableW/2,ty=top+48,rowH=Math.min(28,(h-(ty-y)-12)/(a.rows.length+1));page.rect(tx,ty,tableW,rowH,{fill:[240,247,246],stroke:[167,188,190],width:.6});page.text(tx+tableW*.25,ty+rowH*.65,'Input',6.5,{bold:true,color:DARK,align:'center'});page.text(tx+tableW*.75,ty+rowH*.65,'Output',6.5,{bold:true,color:DARK,align:'center'});page.line(tx+tableW/2,ty,tx+tableW/2,ty+rowH*(a.rows.length+1),{color:[167,188,190],width:.6});for(let i=0;i<a.rows.length;i++){const r=a.rows[i],cy=ty+rowH*(i+1),inFill=answers&&r.hide==='input',outFill=answers&&r.hide==='output';page.rect(tx,cy,tableW/2,rowH,{fill:inFill?HIT:WHITE,stroke:[195,210,212],width:.45});page.rect(tx+tableW/2,cy,tableW/2,rowH,{fill:outFill?HIT:WHITE,stroke:[195,210,212],width:.45});page.text(tx+tableW*.25,cy+rowH*.65,answers||r.hide!=='input'?formatNumber(r.input):'____',6.5,{bold:inFill,color:inFill?TEAL:INK,align:'center'});page.text(tx+tableW*.75,cy+rowH*.65,answers||r.hide!=='output'?formatNumber(r.output):'____',6.5,{bold:outFill,color:outFill?TEAL:INK,align:'center'});}}'''
          new_function = '''  function drawFunctionMachine(page,a,answers,x,y,w,h,index){const top=activityFrame(page,x,y,w,h,index,a);drawWrapped(page,x+12,top,a.instruction,w-24,7.2,{color:MUTED,maxLines:2});const rule=a.operations.map(o=>`${o.op} ${o.value}`).join(' -> ');page.text(x+w/2,top+36,clean(`INPUT -> ${rule} -> OUTPUT`),9.6,{bold:true,color:TEAL,align:'center'});const tableW=Math.min(300,w*.70),tx=x+w/2-tableW/2,ty=top+53,rowH=Math.min(32,(h-(ty-y)-12)/(a.rows.length+1));page.rect(tx,ty,tableW,rowH,{fill:[240,247,246],stroke:[167,188,190],width:.6});page.text(tx+tableW*.25,ty+rowH*.65,'Input',8.8,{bold:true,color:DARK,align:'center'});page.text(tx+tableW*.75,ty+rowH*.65,'Output',8.8,{bold:true,color:DARK,align:'center'});page.line(tx+tableW/2,ty,tx+tableW/2,ty+rowH*(a.rows.length+1),{color:[167,188,190],width:.6});for(let i=0;i<a.rows.length;i++){const r=a.rows[i],cy=ty+rowH*(i+1),inFill=answers&&r.hide==='input',outFill=answers&&r.hide==='output';page.rect(tx,cy,tableW/2,rowH,{fill:inFill?HIT:WHITE,stroke:[195,210,212],width:.45});page.rect(tx+tableW/2,cy,tableW/2,rowH,{fill:outFill?HIT:WHITE,stroke:[195,210,212],width:.45});page.text(tx+tableW*.25,cy+rowH*.65,answers||r.hide!=='input'?formatNumber(r.input):'____',8.8,{bold:inFill,color:inFill?TEAL:INK,align:'center'});page.text(tx+tableW*.75,cy+rowH*.65,answers||r.hide!=='output'?formatNumber(r.output):'____',8.8,{bold:outFill,color:outFill?TEAL:INK,align:'center'});}}'''
          replace(old_function, new_function, 'function-machine text sizing')

          if s == before:
              raise SystemExit('No changes made')
          path.write_text(s, encoding='utf-8')
          print('Readability patch applied:', len(before), '->', len(s), 'bytes')
          PY

      - name: Syntax and smoke tests
        shell: bash
        run: |
          node --check assets/99club/games-pdf.js
          node assets/99club/tests/games-v1302-pdf-parity-smoke.js
          if [ -f assets/99club/tests/games-v1304-number-structures-polish-smoke.js ]; then node assets/99club/tests/games-v1304-number-structures-polish-smoke.js; fi
          node assets/99club/tests/games-random-pack-smoke.js

      - name: Commit patched renderer
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add assets/99club/games-pdf.js
          git commit -m "[pdf-readability-applied] Enlarge printable puzzle text"
          git push origin HEAD
