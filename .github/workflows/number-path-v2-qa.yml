name: Number Path v2 QA

on:
  pull_request:
    paths:
      - 'assets/99club/games-number-path-v2.js'
      - 'assets/99club/tests/games-number-path-v2-smoke.js'
      - '_pages/99-club-games.md'
      - '.github/workflows/number-path-v2-qa.yml'

jobs:
  number-path-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check assets/99club/games-number-path-v2.js
      - name: Number Path v2 regression
        run: node assets/99club/tests/games-number-path-v2-smoke.js
      - name: Existing numeric logic regression
        run: node assets/99club/tests/games-number-logic-smoke.js
