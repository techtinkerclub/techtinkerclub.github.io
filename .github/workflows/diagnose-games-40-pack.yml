name: Diagnose Games 40-pack performance

on:
  push:
    branches:
      - diagnose/games-40-pack-performance

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract Number Towers challenge templates
        run: |
          node <<'NODE'
          const load=['games-number-logic.js','games-number-towers-v137.js','games-number-towers-v137-unique.js'];
          for(const f of load) require('./assets/99club/'+f);
          const NL=global.TT99NumberLogicGames;
          const settings={minYear:1,maxYear:6,topics:['number_place_value'],engineSettings:{numbertowers:{difficulty:'challenge',gridSize:'auto',clueLevel:'auto'}}};
          for(const seed of ['template:A','template:B','template:C']){
            const t0=Date.now(),a=NL.generate('numbertowers',settings,seed),v=NL.validate(a);
            console.log('TEMPLATE',seed,'ms',Date.now()-t0,'valid',v.ok,'size',a.size);
            console.log(JSON.stringify({solutionGrid:a.solutionGrid,clues:a.clues}));
          }
          NODE
