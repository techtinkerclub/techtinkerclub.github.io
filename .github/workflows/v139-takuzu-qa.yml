name: v1.39 Takuzu QA
on:
  push:
    branches: [chatgpt/v139-takuzu-instructions]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-takuzu-v139.js
          node --check assets/99club/games-takuzu-v139-ui.js
          node --check assets/99club/games-instructions-v139.js
          node --check assets/99club/games-pdf-takuzu-v139.js
      - name: Takuzu and instruction tests
        run: node assets/99club/tests/games-v139-takuzu-smoke.js
      - name: Existing regressions
        run: |
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-property-maze-smoke.js
          node assets/99club/tests/games-sumplete-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
      - name: Build QA PDF
        run: node assets/99club/tests/build-v139-takuzu-qa-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: v139-takuzu-qa
          path: artifacts/v139-takuzu-qa.pdf
