name: Symbol Decoder v1.88 checks

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-play-symbol-decoder-v188.js
          node --check assets/99club/tests/games-play-symbol-decoder-v188-smoke.js
      - name: Decoder generation tests
        run: node assets/99club/tests/games-play-symbol-decoder-v188-smoke.js
      - name: Integration guards
        run: |
          grep -q 'games-play-symbol-decoder-v188.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-symbol-decoder-v188.js?v=1' _pages/99-club-games-play.md
          grep -q 'v1.88 — Symbol Decoder gameplay' docs/99club/GAMES.md
          grep -q "Play.registerAdapter('symbols',adapter)" assets/99club/games-play-symbol-decoder-v188.js
