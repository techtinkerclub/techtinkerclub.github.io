name: Check Word Search v1.50

on:
  push:
    branches:
      - fix/wordsearch-duplicates-direction-tip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check assets/99club/games-wordsearch-quality-v150.js
          node --check assets/99club/games-play-wordsearch-v1.js
      - name: Generate and audit Word Searches
        run: |
          node <<'NODE'
          global.localStorage=undefined;
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-wordsearch-quality-v150.js');
          const G=global.TT99Games,Q=G.WORDSEARCH_QUALITY;
          if(!Q)throw new Error('quality guard missing');
          const modes=['straight','diagonal','all','auto'],diffs=['easy','standard','challenge'];
          let total=0;
          for(const difficulty of diffs)for(const directionMode of modes)for(let i=0;i<100;i++){
            const settings={minYear:1,maxYear:6,topics:['number_place_value','calculation','fractions','geometry','statistics','algebra'],engineSettings:{wordsearch:{difficulty,clueMode:difficulty==='challenge'?'definitions':'words_definitions',wordCount:'auto',gridSize:'auto',directionMode}}};
            const a=G.generateWordSearch(settings,`v150:${difficulty}:${directionMode}:${i}`,[]);
            if(a.error)throw new Error(`${difficulty}/${directionMode}/${i}: ${a.error}`);
            const q=Q.audit(a);if(!q.ok)throw new Error(`${difficulty}/${directionMode}/${i}: audit failed ${JSON.stringify(q)}`);
            const words=a.placements.map(p=>G.normalizeTerm(p.term));if(new Set(words).size!==words.length)throw new Error('duplicate target terms selected');
            total++;
          }
          console.log(`audited ${total} generated Word Searches`);

          // Deliberately manufacture a second SUM in filler cells and prove detection/repair.
          const synthetic={engineId:'wordsearch',title:'Maths Word Search',size:5,grid:[['S','U','M','A','A'],['A','A','A','A','A'],['A','A','A','A','A'],['S','U','M','A','A'],['A','A','A','A','A']],placements:[{term:'SUM',definition:'test',cells:[[0,0],[1,0],[2,0]]}]};
          const before=Q.audit(synthetic);if(before.ok||before.extras.length!==1)throw new Error(`synthetic duplicate not detected: ${JSON.stringify(before)}`);
          const fixed=Q.repair(synthetic);if(!fixed)throw new Error('synthetic duplicate could not be repaired');
          const after=Q.audit(fixed);if(!after.ok)throw new Error(`synthetic repair failed: ${JSON.stringify(after)}`);
          if(fixed.grid[0].join('')!=='SUMAA')throw new Error('repair altered intended SUM');
          console.log('synthetic duplicate detection/repair passed');

          const straight=G.generateWordSearch({minYear:1,maxYear:6,topics:['calculation'],engineSettings:{wordsearch:{difficulty:'easy',clueMode:'words_definitions',wordCount:'6',gridSize:'12',directionMode:'straight'}}},'v150:tip:straight',[]);
          const all=G.generateWordSearch({minYear:1,maxYear:6,topics:['calculation'],engineSettings:{wordsearch:{difficulty:'challenge',clueMode:'definitions',wordCount:'6',gridSize:'16',directionMode:'all'}}},'v150:tip:all',[]);
          if(!/No backwards words/.test(straight.directionTip||''))throw new Error(`straight direction tip missing: ${straight.directionTip}`);
          if(!/backwards/.test(all.directionTip||''))throw new Error(`all-direction tip missing: ${all.directionTip}`);
          console.log('direction metadata passed');
          NODE
