name: Property Maze integration QA

on:
  push:
    branches: [chatgpt/v1.33.0-property-maze]
    paths:
      - .github/workflows/property-maze-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v1.33.0-property-maze

      - name: Patch shared preview, PDF and page entrypoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {n}')
              p.write_text(s.replace(old,new,1))

          app='assets/99club/games-app.js'
          replace_once(app,
              "engines:['maze','crossnumber','numbersearch','equationcrossgrid','target','brokencalc','operationgrid','kakuro','arithmeticcages','sumplete']",
              "engines:['maze','propertymaze','crossnumber','numbersearch','equationcrossgrid','target','brokencalc','operationgrid','kakuro','arithmeticcages','sumplete']",
              'app category')

          render_property = r'''
          function renderPropertyMaze(a,answers,index,si,ai){
            const route=new Set(a.solutionKeys||[]),start=`${a.start?.[0]}:${a.start?.[1]}`,finish=`${a.finish?.[0]}:${a.finish?.[1]}`;
            const grid=(a.grid||[]).flatMap((row,r)=>row.map((value,c)=>{
              const k=`${r}:${c}`,isStart=k===start,isFinish=k===finish,onRoute=route.has(k),cls=['tt99-maze-cell',isStart?'start':'',isFinish?'finish':'',answers&&onRoute?'correct-route':''].filter(Boolean).join(' '),badge=isStart?'<i>START</i>':isFinish?'<i>FINISH</i>':'';
              return `<span class="${cls}">${badge}<b>${esc(G.formatNumber(value))}</b></span>`;
            }).join('')).join('');
            const dead=a.deadEndCount||0,rule=esc(a.rule?.shortLabel||a.rule?.label||'Number property'),studentNote=dead?`${dead} matching ${dead===1?'number is':'numbers are'} dead ${dead===1?'end':'ends'} — not every matching square belongs to the final route.`:'Every matching square on this puzzle belongs to the route.';
            return `<section class="tt99-game-activity tt99-maze tt99-propertymaze">${activityReplaceButton(si,ai)}${arithmeticHead(a,index)}<div class="tt99-maze-layout"><div class="tt99-maze-grid tt99-propertymaze-grid" style="--maze-size:${a.size||5}">${grid}</div><div class="tt99-maze-questions tt99-propertymaze-rule"><h4>Rule</h4><div class="rule-card"><strong>Move only through</strong><span>${rule}</span></div><p>${answers?'Highlighted cells show the unique START → FINISH route.':studentNote}</p>${answers&&dead?`<p class="answer-note">${dead} matching ${dead===1?'dead end is':'dead ends are'} deliberately outside the solution route.</p>`:''}</div></div></section>`;
          }
          '''
          replace_once(app,"\n  function renderCrossnumber(","\n"+render_property+"\n  function renderCrossnumber(",'app property renderer')
          replace_once(app,
              "if(a.engineId==='maze')return renderMaze(a,answers,index,si,ai);if(a.engineId==='crossnumber')",
              "if(a.engineId==='maze')return renderMaze(a,answers,index,si,ai);if(a.engineId==='propertymaze')return renderPropertyMaze(a,answers,index,si,ai);if(a.engineId==='crossnumber')",
              'app property dispatch')

          pdf='assets/99club/games-pdf.js'
          draw_property = r'''
          function drawPropertyMaze(page,a,answers,x,y,w,h,index){
            const top=activityFrame(page,x,y,w,h,index,a);drawWrapped(page,x+12,top,a.instruction,w-24,6.4,{color:MUTED,maxLines:2});
            const bodyY=top+31,bodyH=h-(bodyY-y)-10,size=a.size||5,gridAvailW=w*.58,cell=Math.min((gridAvailW-8)/size,(bodyH-4)/size,42),gridW=cell*size,gx=x+14+(gridAvailW-gridW)/2,gy=bodyY+Math.max(0,(bodyH-gridW)/2),route=new Set(a.solutionKeys||[]),start=`${a.start?.[0]}:${a.start?.[1]}`,finish=`${a.finish?.[0]}:${a.finish?.[1]}`;
            for(let r=0;r<size;r++)for(let c=0;c<size;c++){
              const key=`${r}:${c}`,isStart=key===start,isFinish=key===finish,onRoute=route.has(key),fill=answers&&onRoute?HIT:WHITE,stroke=isStart||isFinish?[68,126,120]:[158,178,181];
              page.rect(gx+c*cell,gy+r*cell,cell,cell,{fill,stroke,width:isStart||isFinish?1:.55});
              fitDiagramText(page,gx+c*cell+cell/2,gy+r*cell+cell*.64,formatNumber(a.grid?.[r]?.[c]),cell-5,Math.max(5,Math.min(8.2,cell*.27)),{bold:true,color:isStart||isFinish?TEAL:INK});
              if(isStart||isFinish)page.text(gx+c*cell+(isFinish?cell-2.3:2.3),gy+r*cell+6,isStart?'START':'FINISH',Math.max(3.2,Math.min(4.5,cell*.13)),{bold:true,color:TEAL,align:isFinish?'right':'left'});
            }
            const qx=x+gridAvailW+22,qw=w-gridAvailW-35,rule=clean(a.rule?.shortLabel||a.rule?.label||'Number property');page.text(qx,bodyY+10,'Rule',9,{bold:true,color:DARK});
            box(page,qx,bodyY+18,qw,52,PALE,LINE,.7);drawWrapped(page,qx+8,bodyY+33,'Move only through',qw-16,7,{bold:true,color:MUTED,maxLines:1});drawWrapped(page,qx+8,bodyY+49,rule,qw-16,8.4,{bold:true,color:TEAL,maxLines:2});
            const dead=a.deadEndCount||0,note=answers?'Highlighted cells show the unique START to FINISH route.':dead?`${dead} matching ${dead===1?'number is':'numbers are'} a dead end. Not every matching square is on the final route.`:'All matching squares belong to the route in this version.';
            drawWrapped(page,qx,bodyY+88,note,qw,7,{color:answers?TEAL:MUTED,bold:!!answers,maxLines:5});
            if(answers&&dead)drawWrapped(page,qx,bodyY+129,`${dead} matching ${dead===1?'dead end is':'dead ends are'} deliberately outside the answer route.`,qw,6.8,{color:MUTED,maxLines:4});
          }
          '''
          replace_once(pdf,"\n  function drawCrossnumber(","\n"+draw_property+"\n  function drawCrossnumber(",'pdf property renderer')
          replace_once(pdf,
              "if(a.engineId==='maze')return drawMaze(page,a,answers,x,y,w,h,index);if(a.engineId==='crossnumber')",
              "if(a.engineId==='maze')return drawMaze(page,a,answers,x,y,w,h,index);if(a.engineId==='propertymaze')return drawPropertyMaze(page,a,answers,x,y,w,h,index);if(a.engineId==='crossnumber')",
              'pdf property dispatch')
          replace_once(pdf,
              "['arithmagon','magicshape','maze','crossnumber','numbersearch','equationcrossgrid','numbertrail','target','brokencalc','symbols','domino','operationgrid','numberwheels','functionmachine','balance']",
              "['arithmagon','magicshape','maze','propertymaze','crossnumber','numbersearch','equationcrossgrid','numbertrail','target','brokencalc','symbols','domino','operationgrid','numberwheels','functionmachine','balance']",
              'pdf arithmetic whitelist')

          page='_pages/99-club-games.md'
          replace_once(page,
              '<link rel="stylesheet" href="/assets/99club/games-sumplete.css?v=1">',
              '<link rel="stylesheet" href="/assets/99club/games-sumplete.css?v=1">\n<link rel="stylesheet" href="/assets/99club/games-property-maze.css?v=1">',
              'page property css')
          replace_once(page,
              '<script src="/assets/99club/games-crossgrid-v1321.js?v=2"></script>',
              '<script src="/assets/99club/games-crossgrid-v1321.js?v=2"></script>\n<script src="/assets/99club/games-property-maze.js?v=1"></script>',
              'page property engine')
          replace_once(page,'games-pdf.js?v=18','games-pdf.js?v=19','page pdf cache')
          replace_once(page,'games-app.js?v=20','games-app.js?v=21','page app cache')
          PY

      - name: Syntax checks
        run: |
          node --check assets/99club/games-property-maze.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js

      - name: Property Maze regression
        run: node assets/99club/tests/games-property-maze-smoke.js

      - name: Existing arithmetic regression
        run: node assets/99club/tests/games-arithmetic-expansion-smoke.js

      - name: Existing number logic regression
        run: node assets/99club/tests/games-number-logic-smoke.js

      - name: Existing crossgrid and nonogram layout regression
        run: node assets/99club/tests/games-v1321-layout-smoke.js

      - name: Existing random pack regression
        run: node assets/99club/tests/games-random-pack-smoke.js

      - name: Upload Property Maze PDF QA
        uses: actions/upload-artifact@v4
        with:
          name: property-maze-v1330-qa
          path: /tmp/property-maze-qa.pdf
          if-no-files-found: error

      - name: Commit integrated files after QA
        run: |
          git config user.name "ChatGPT QA"
          git config user.email "actions@users.noreply.github.com"
          git add _pages/99-club-games.md assets/99club/games-app.js assets/99club/games-pdf.js
          git commit -m "Integrate Number Property Maze preview and PDF"
          git push origin HEAD:chatgpt/v1.33.0-property-maze
