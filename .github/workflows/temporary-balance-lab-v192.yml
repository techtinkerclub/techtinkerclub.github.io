name: Balance Lab v1.92 integration

on:
  push:
    branches:
      - feat/balance-lab-v192

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/balance-lab-v192
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch once
        run: |
          if grep -q 'games-balance-lab-v192.js?v=1' _pages/99-club-games.md; then
            echo 'Balance Lab integration already applied.'
          else
            python assets/99club/tests/apply-balance-lab-v192.py
          fi
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-balance-lab-v192.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
          node --check assets/99club/games-puzzle-redesign-v136.js
          node --check assets/99club/games-pdf-v136.js
          node --check assets/99club/tests/games-balance-lab-v192-smoke.js
      - name: Generator smoke tests
        run: node assets/99club/tests/games-balance-lab-v192-smoke.js
      - name: PDF runtime checks
        run: |
          node - <<'NODE'
          require('./assets/99club/simple-pdf.js');
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-balance-lab-v192.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-puzzle-redesign-v135-logic.js');
          require('./assets/99club/games-pdf.js');
          require('./assets/99club/games-pdf-v136.js');
          const G=global.TT99Games,PDF=global.TT99GamesPDF;
          for(const difficulty of ['easy','standard','challenge']){
            const settings=G.normalizeSettings({minYear:4,maxYear:6,topics:['calculation','algebra'],sheets:1,activitiesPerSheet:2,selectedEngines:['balance'],includeAnswers:true,engineSettings:{balance:{difficulty,rowCount:'auto',style:'auto'}}});
            const pack=G.generatePack(settings,`balance-v192-${difficulty}`);
            const acts=pack.sheets.flatMap(s=>s.activities||[]);
            if(!acts.length||acts.some(a=>a.title!=='Balance Lab'||!a.finalChallenge))throw new Error('pack did not use Balance Lab generator');
            const doc=PDF.buildDocument({pack,settings:pack.settings,kind:'both',topics:G.TOPICS||{},seed:pack.seed});
            const commands=doc.pages.flatMap(p=>p.cmds||[]).join('\n');
            for(const marker of ['FINAL BALANCE','WEIGHT','EXAMPLE SOLUTION'])if(!commands.includes(marker))throw new Error(`PDF missing ${marker}`);
            if(commands.includes('REPAIR TILES'))throw new Error('legacy Equation Repair PDF overlay returned');
            const bytes=doc.outputBytes();if(bytes.length<5000)throw new Error(`PDF unexpectedly small: ${bytes.length}`);
            console.log(difficulty,acts[0].rows.length,bytes.length);
          }
          NODE
      - name: Integration guards
        run: |
          grep -q 'games-balance-lab-v192.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-balance-lab-v192.js?v=1' _pages/99-club-games-play.md
          grep -q 'games-balance-lab-v192.css?v=1' _pages/99-club-games.md
          grep -q 'games-balance-lab-v192.js?v=1' _pages/99-club-games.md
          grep -q 'games-app.js?v=24' _pages/99-club-games.md
          grep -q 'games-pdf.js?v=23' _pages/99-club-games.md
          grep -q 'games-pdf-v136.js?v=3' _pages/99-club-games.md
          grep -q 'games-puzzle-redesign-v136.js?v=2' _pages/99-club-games.md
          grep -q "classList.contains('tt99-balance-lab-print')" assets/99club/games-puzzle-redesign-v136.js
          ! grep -q "\['balance','operationgrid','functionmachine'\]" assets/99club/games-pdf-v136.js
          grep -q 'FINAL BALANCE - EXAMPLE SOLUTION' assets/99club/games-pdf.js
          grep -q "adapter.title='Balance Lab'" assets/99club/games-balance-lab-v192.js
      - name: Commit integration if changed
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-balance-lab-v192.js assets/99club/games-app.js assets/99club/games-pdf.js assets/99club/games-puzzle-redesign-v136.js assets/99club/games-pdf-v136.js _pages/99-club-games.md _pages/99-club-games-play.md docs/99club/GAMES.md
          git commit -m '[v1.92 integration] Wire Balance Lab into online and printable play'
          git push origin HEAD:feat/balance-lab-v192
