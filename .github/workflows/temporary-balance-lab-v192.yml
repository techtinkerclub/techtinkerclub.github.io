name: Balance Lab v1.92 integration

on:
  push:
    branches: [ feat/balance-lab-v192 ]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v1.92 integration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/balance-lab-v192
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate Balance Lab
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              p.write_text(t.replace(old,new,count))

          # Finish the shared generator settings: keep legacy saved values compatible,
          # but expose a useful operations control for the new mechanic.
          p=Path('assets/99club/games-balance-lab-v192.js'); t=p.read_text()
          t=t.replace("  return {difficulty,rowCount:validRows.includes(String(raw.rowCount))?String(raw.rowCount):'auto',style:['auto','number','expression'].includes(raw.style)?raw.style:'auto'};",
                      "  const style=raw.style==='number'?'additive':raw.style==='expression'?'mixed':raw.style;\n  return {difficulty,rowCount:validRows.includes(String(raw.rowCount))?String(raw.rowCount):'auto',style:['auto','additive','mixed'].includes(style)?style:'auto'};",1)
          t=t.replace("function completeExpr(target,difficulty,rng){", "function completeExpr(target,difficulty,rng,allowMul){",1)
          t=t.replace("  if(difficulty!=='easy'){\n    const ds=divisors(target);if(ds.length){const d=choose(rng,ds);candidates.push(`${d} × ${target/d}`);}\n    const d=randInt(rng,2,difficulty==='challenge'?9:6);candidates.push(`${target*d} ÷ ${d}`);\n  }",
                      "  if(allowMul){\n    const ds=divisors(target);if(ds.length){const d=choose(rng,ds);candidates.push(`${d} × ${target/d}`);}\n    const d=randInt(rng,2,difficulty==='challenge'?9:6);candidates.push(`${target*d} ÷ ${d}`);\n  }",1)
          t=t.replace("function blankExpr(target,difficulty,rng){", "function blankExpr(target,difficulty,rng,allowMul){",1)
          t=t.replace("  if(difficulty!=='easy'){\n    const ds=divisors(target);if(ds.length){const d=choose(rng,ds);candidates.push({text:`${d} × □`,answer:target/d});candidates.push({text:`□ × ${d}`,answer:target/d});}\n    const d=randInt(rng,2,difficulty==='challenge'?9:6);candidates.push({text:`□ ÷ ${d}`,answer:target*d});\n    if(difficulty==='challenge')candidates.push({text:`${target*d} ÷ □`,answer:d});\n  }",
                      "  if(allowMul){\n    const ds=divisors(target);if(ds.length){const d=choose(rng,ds);candidates.push({text:`${d} × □`,answer:target/d});candidates.push({text:`□ × ${d}`,answer:target/d});}\n    const d=randInt(rng,2,difficulty==='challenge'?9:6);candidates.push({text:`□ ÷ ${d}`,answer:target*d});\n    if(difficulty==='challenge')candidates.push({text:`${target*d} ÷ □`,answer:d});\n  }",1)
          t=t.replace("function makeRow(target,difficulty,rng,index){\n  const blank=blankExpr(target,difficulty,rng),known=completeExpr(target,difficulty,rng),swap=(index+rng())%2>1;",
                      "function makeRow(target,difficulty,style,rng,index){\n  const allowMul=style==='mixed'||(style==='auto'&&difficulty!=='easy');\n  const blank=blankExpr(target,difficulty,rng,allowMul),known=completeExpr(target,difficulty,rng,allowMul),swap=(index+rng())%2>1;",1)
          t=t.replace("  const rows=final.weights.map((v,i)=>makeRow(v,c.difficulty,rng,i));",
                      "  const rows=final.weights.map((v,i)=>makeRow(v,c.difficulty,c.style,rng,i));",1)
          t=t.replace("  if(style){style.label='Puzzle mix';style.options=[{value:'auto',label:'Mixed operations'},{value:'number',label:'Missing values'},{value:'expression',label:'Inverse-heavy'}];}",
                      "  if(style){style.label='Operations';style.options=[{value:'auto',label:'Auto for difficulty'},{value:'additive',label:'Addition + subtraction'},{value:'mixed',label:'Mixed + − × ÷'}];}",1)
          old_select="""  root.innerHTML=`<label><span>Difficulty</span><select data-bl-opt=\"difficulty\">${['easy','standard','challenge'].map(v=>`<option value=\"${v}\" ${c.difficulty===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label><label><span>Balances</span><select data-bl-opt=\"rowCount\">${[['auto','Auto'],['4','4'],['5','5'],['6','6'],['8','8']].map(([v,l])=>`<option value=\"${v}\" ${c.rowCount===v?'selected':''}>${l}</option>`).join('')}</select></label>`;"""
          new_select="""  root.innerHTML=`<label><span>Difficulty</span><select data-bl-opt=\"difficulty\">${['easy','standard','challenge'].map(v=>`<option value=\"${v}\" ${c.difficulty===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label><label><span>Balances</span><select data-bl-opt=\"rowCount\">${[['auto','Auto'],['4','4'],['5','5'],['6','6'],['8','8']].map(([v,l])=>`<option value=\"${v}\" ${c.rowCount===v?'selected':''}>${l}</option>`).join('')}</select></label><label><span>Operations</span><select data-bl-opt=\"style\"><option value=\"auto\" ${c.style==='auto'?'selected':''}>Auto</option><option value=\"additive\" ${c.style==='additive'?'selected':''}>+ and −</option><option value=\"mixed\" ${c.style==='mixed'?'selected':''}>+ − × ÷</option></select></label>`;"""
          if old_select not in t: raise SystemExit('online options anchor missing')
          t=t.replace(old_select,new_select,1)
          adapter_anchor="adapter.title='Balance Lab';"
          adapter_setup="adapter.normalizeConfig=normalise;adapter.fromQuery=q=>({difficulty:q.get('d')||undefined,rowCount:q.get('rc')||undefined,style:q.get('s')||undefined});adapter.toQuery=c=>{c=normalise(c);return {d:c.difficulty,rc:c.rowCount,s:c.style};};adapter.recordKey=c=>{c=normalise(c);return `${c.difficulty}:${c.rowCount}:${c.style}:v192`;};adapter.createPuzzle=(c,seed)=>generateBalanceLab({minYear:c?.difficulty==='easy'?2:4,maxYear:6,topics:['calculation','algebra'],engineSettings:{balance:normalise(c)}},seed);\n"
          if adapter_anchor not in t: raise SystemExit('adapter setup anchor missing')
          t=t.replace(adapter_anchor,adapter_setup+adapter_anchor,1)
          p.write_text(t)

          # Wire the shared generator/styling into Online Play after the base adapter exists.
          play=Path('_pages/99-club-games-play.md'); t=play.read_text()
          css_anchor='<link rel="stylesheet" href="/assets/99club/games-play-symbol-decoder-v189.css?v=1">'
          if css_anchor not in t: raise SystemExit('online css anchor missing')
          t=t.replace(css_anchor,css_anchor+'\n<link rel="stylesheet" href="/assets/99club/games-balance-lab-v192.css?v=1">',1)
          js_anchor='<script src="/assets/99club/games-play-symbol-decoder-v189.js?v=1"></script>'
          if js_anchor not in t: raise SystemExit('online js anchor missing')
          t=t.replace(js_anchor,js_anchor+'\n<script src="/assets/99club/games-balance-lab-v192.js?v=1"></script>',1)
          play.write_text(t)

          # Wire printable generator before games-engine, plus printable CSS.
          page=Path('_pages/99-club-games.md'); t=page.read_text()
          css_anchor='<link rel="stylesheet" href="/assets/99club/games-symbol-decoder-v189.css?v=2">'
          if css_anchor not in t: raise SystemExit('print css anchor missing')
          t=t.replace(css_anchor,css_anchor+'\n<link rel="stylesheet" href="/assets/99club/games-balance-lab-v192.css?v=1">',1)
          js_anchor='<script src="/assets/99club/games-arithmetic.js?v=6"></script>'
          if js_anchor not in t: raise SystemExit('print generator anchor missing')
          t=t.replace(js_anchor,js_anchor+'\n<script src="/assets/99club/games-balance-lab-v192.js?v=1"></script>',1)
          for old,new in [('games-pdf.js?v=22','games-pdf.js?v=23'),('games-pdf-v136.js?v=2','games-pdf-v136.js?v=3'),('games-app.js?v=23','games-app.js?v=24'),('games-puzzle-redesign-v136.js?v=1','games-puzzle-redesign-v136.js?v=2')]:
              if old not in t: raise SystemExit(f'cache anchor missing: {old}')
              t=t.replace(old,new,1)
          page.write_text(t)

          # New printable/browser layout. This deliberately keeps the familiar 99 Club
          # activity card, while making the final reward part of the same activity.
          app=Path('assets/99club/games-app.js'); t=app.read_text()
          old="""  function renderBalance(a,answers,index,si,ai){return `<section class=\"tt99-game-activity tt99-balance\">${activityReplaceButton(si,ai)}${arithmeticHead(a,index)}<div class=\"tt99-equation-list big\">${a.rows.map(r=>`<div>${esc(answers?r.solution:r.display)}</div>`).join('')}</div></section>`;}"""
          new="""  function renderBalance(a,answers,index,si,ai){const f=a.finalChallenge||{},left=f.solutionLeft||[],right=f.solutionRight||[],cards=a.rows.map((r,i)=>`<div class=\"tt99-balance-print-card\"><small>Balance ${i+1}</small><div class=\"tt99-balance-print-eq\">${esc(answers?r.solution:r.display)}</div><div class=\"tt99-balance-print-weight\">Collected weight <b>${answers?esc(r.balancedValue):'________'}</b></div></div>`).join(''),final=answers?`<div class=\"tt99-balance-print-final\"><small>Final balance · example solution</small><p>Use every collected weight once.</p><div class=\"tt99-balance-print-pans\"><span class=\"tt99-balance-print-pan\">${esc(left.join(' + '))}</span><b class=\"tt99-balance-print-equals\">=</b><span class=\"tt99-balance-print-pan\">${esc(right.join(' + '))}</span></div></div>`:`<div class=\"tt99-balance-print-final\"><small>Final balance</small><p>Use every collected weight once. Split them between the two pans so both totals are equal.</p><div class=\"tt99-balance-print-pans\"><span class=\"tt99-balance-print-pan\">LEFT PAN __________________</span><b class=\"tt99-balance-print-equals\">=</b><span class=\"tt99-balance-print-pan\">RIGHT PAN __________________</span></div></div>`;return `<section class=\"tt99-game-activity tt99-balance tt99-balance-lab-print\">${activityReplaceButton(si,ai)}${arithmeticHead(a,index)}<div class=\"tt99-balance-print-list\">${cards}</div>${final}</section>`;}"""
          if old not in t: raise SystemExit('games-app renderBalance anchor missing')
          app.write_text(t.replace(old,new,1))

          # Stop the old browser 'repair tiles' redesign from replacing Balance Lab.
          redesign=Path('assets/99club/games-puzzle-redesign-v136.js'); t=redesign.read_text()
          old="function redesignBalance(a){if(a.dataset.v136)return;"
          new="function redesignBalance(a){if(a.classList.contains('tt99-balance-lab-print')||a.dataset.v136)return;"
          if old not in t: raise SystemExit('browser legacy balance anchor missing')
          redesign.write_text(t.replace(old,new,1))

          # Base PDF now owns Balance Lab. Build compact equation cards and a final pan area.
          pdf=Path('assets/99club/games-pdf.js'); t=pdf.read_text()
          old="""  function drawBalance(page,a,answers,x,y,w,h,index){const top=activityFrame(page,x,y,w,h,index,a);drawWrapped(page,x+12,top,a.instruction,w-24,6.8,{color:MUTED,maxLines:2});let cy=top+32,rowH=(h-(cy-y)-12)/a.rows.length;for(const r of a.rows){page.rect(x+w*.15,cy,w*.70,Math.min(30,rowH-4),{fill:WHITE,stroke:[216,227,228],width:.5});page.text(x+w/2,cy+Math.min(20,rowH*.62),clean(answers?r.solution:r.display),8.2,{bold:true,color:answers?TEAL:INK,align:'center'});cy+=rowH;}}"""
          new="""  function drawBalance(page,a,answers,x,y,w,h,index){
    const top=activityFrame(page,x,y,w,h,index,a);drawWrapped(page,x+12,top,a.instruction,w-24,6.6,{color:MUTED,maxLines:2});
    const f=a.finalChallenge||{},cols=2,rows=Math.ceil(a.rows.length/cols),bodyY=top+29,finalH=64,gapX=7,gapY=6,cardW=(w-30-gapX)/2,available=h-(bodyY-y)-finalH-9,cardH=Math.max(31,Math.min(45,(available-gapY*(rows-1))/Math.max(1,rows)));
    a.rows.forEach((r,i)=>{const rr=Math.floor(i/cols),cc=i%cols,cx=x+15+cc*(cardW+gapX),cy=bodyY+rr*(cardH+gapY);drawRoundRect(page,cx,cy,cardW,cardH,6,{fill:WHITE,stroke:[207,224,223],width:.65});page.text(cx+7,cy+9,`BALANCE ${i+1}`,4.5,{bold:true,color:MUTED});fitDiagramText(page,cx+cardW/2,cy+cardH*.53,clean(answers?r.solution:r.display),cardW-14,7.4,{bold:true,color:answers?TEAL:INK});page.text(cx+7,cy+cardH-6,'WEIGHT',4.3,{bold:true,color:MUTED});const value=answers?formatNumber(r.balancedValue):'________';fitDiagramText(page,cx+cardW-8,cy+cardH-6,value,cardW*.45,5.8,{bold:true,color:answers?TEAL:DARK});});
    const fy=y+h-finalH+3;drawRoundRect(page,x+15,fy,w-30,finalH-8,7,{fill:answers?[248,252,251]:[245,250,249],stroke:[178,207,203],width:.75});page.text(x+w/2,fy+10,answers?'FINAL BALANCE - EXAMPLE SOLUTION':'FINAL BALANCE',5.2,{bold:true,color:MUTED,align:'center'});page.text(x+w/2,fy+21,'Use every collected weight once.',5.2,{color:DARK,align:'center'});
    if(answers){const left=(f.solutionLeft||[]).join(' + '),right=(f.solutionRight||[]).join(' + ');fitDiagramText(page,x+w/2,fy+42,`${left} = ${right}`,w-60,7.2,{bold:true,color:TEAL});}
    else{const panW=(w-82)/2,py=fy+31;page.text(x+19,py,'LEFT PAN',4.4,{bold:true,color:MUTED});page.line(x+19,py+14,x+19+panW,py+14,{color:[118,151,151],width:1});page.text(x+w/2,py+12,'=',8,{bold:true,color:TEAL,align:'center'});page.text(x+w/2+22,py,'RIGHT PAN',4.4,{bold:true,color:MUTED});page.line(x+w/2+22,py+14,x+w/2+22+panW,py+14,{color:[118,151,151],width:1});}
  }"""
          if old not in t: raise SystemExit('games-pdf drawBalance anchor missing')
          pdf.write_text(t.replace(old,new,1))

          # Stop the legacy PDF parity overlay drawing old Equation Repair tiles over it.
          overlay=Path('assets/99club/games-pdf-v136.js'); t=overlay.read_text()
          t=t.replace(' * Symbol Decoder is intentionally excluded: games-pdf.js v1.89+ owns its paper layout.',' * Symbol Decoder and Balance Lab are intentionally excluded: the base PDF renderer owns their current paper layouts.',1)
          old="function drawOverlay(cmds,a,answers,x,y,w,h,index){if(a.engineId==='balance')return drawRepair(cmds,a,answers,x,y,w,h,index);if(a.engineId==='operationgrid')return drawCode(cmds,a,answers,x,y,w,h,index);if(a.engineId==='functionmachine')return drawMachine(cmds,a,answers,x,y,w,h,index);}"
          new="function drawOverlay(cmds,a,answers,x,y,w,h,index){if(a.engineId==='operationgrid')return drawCode(cmds,a,answers,x,y,w,h,index);if(a.engineId==='functionmachine')return drawMachine(cmds,a,answers,x,y,w,h,index);}"
          if old not in t: raise SystemExit('PDF drawOverlay anchor missing')
          t=t.replace(old,new,1)
          old="if(['balance','operationgrid','functionmachine'].includes(a.engineId))drawOverlay(entry.cmds,a,answers,M,bodyTop+i*(ah+gap),w,ah,i+1);"
          new="if(['operationgrid','functionmachine'].includes(a.engineId))drawOverlay(entry.cmds,a,answers,M,bodyTop+i*(ah+gap),w,ah,i+1);"
          if old not in t: raise SystemExit('PDF overlaySheet anchor missing')
          overlay.write_text(t.replace(old,new,1))

          # Brief catalogue note.
          docs=Path('docs/99club/GAMES.md')
          if docs.exists():
              t=docs.read_text()
              if 'Balance the Equation' in t and 'Balance Lab' not in t:
                  t=t.replace('Balance the Equation','Balance the Equation (Online Play: Balance Lab)',1)
              t += '\n\n### v1.92 — Balance Lab\nBalance the Equation now uses operations on both sides. Each solved equation yields its common balanced value as a weight; all weights feed a final equal-partition challenge. Online accepts any valid equal split; printable answers show an example solution.\n'
              docs.write_text(t)
          PY
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-balance-lab-v192.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
          node --check assets/99club/games-puzzle-redesign-v136.js
          node --check assets/99club/games-pdf-v136.js
          node --check assets/99club/tests/games-balance-lab-v192-smoke.js
      - name: Generator smoke tests
        run: node assets/99club/tests/games-balance-lab-v192-smoke.js
      - name: PDF runtime checks
        run: |
          node - <<'NODE'
          require('./assets/99club/simple-pdf.js');
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-balance-lab-v192.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-puzzle-redesign-v135-logic.js');
          require('./assets/99club/games-pdf.js');
          require('./assets/99club/games-pdf-v136.js');
          const G=global.TT99Games,PDF=global.TT99GamesPDF;
          for(const difficulty of ['easy','standard','challenge']){
            const settings=G.normalizeSettings({minYear:4,maxYear:6,topics:['calculation','algebra'],sheets:1,activitiesPerSheet:2,selectedEngines:['balance'],includeAnswers:true,engineSettings:{balance:{difficulty,rowCount:'auto',style:'auto'}}});
            const pack=G.generatePack(settings,`balance-v192-${difficulty}`);
            const acts=pack.sheets.flatMap(s=>s.activities||[]);
            if(!acts.length||acts.some(a=>a.title!=='Balance Lab'||!a.finalChallenge))throw new Error('pack did not use Balance Lab generator');
            const doc=PDF.buildDocument({pack,settings:pack.settings,kind:'both',topics:G.TOPICS||{},seed:pack.seed});
            const commands=doc.pages.flatMap(p=>p.cmds||[]).join('\n');
            for(const marker of ['FINAL BALANCE','WEIGHT','EXAMPLE SOLUTION'])if(!commands.includes(marker))throw new Error(`PDF missing ${marker}`);
            if(commands.includes('REPAIR TILES'))throw new Error('legacy Equation Repair PDF overlay returned');
            const bytes=doc.outputBytes();if(bytes.length<5000)throw new Error(`PDF unexpectedly small: ${bytes.length}`);
            console.log(difficulty,acts[0].rows.length,bytes.length);
          }
          NODE
      - name: Integration guards
        run: |
          grep -q 'games-balance-lab-v192.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-balance-lab-v192.js?v=1' _pages/99-club-games-play.md
          grep -q 'games-balance-lab-v192.css?v=1' _pages/99-club-games.md
          grep -q 'games-balance-lab-v192.js?v=1' _pages/99-club-games.md
          grep -q 'games-app.js?v=24' _pages/99-club-games.md
          grep -q 'games-pdf.js?v=23' _pages/99-club-games.md
          grep -q 'games-pdf-v136.js?v=3' _pages/99-club-games.md
          grep -q 'games-puzzle-redesign-v136.js?v=2' _pages/99-club-games.md
          grep -q "classList.contains('tt99-balance-lab-print')" assets/99club/games-puzzle-redesign-v136.js
          ! grep -q "\['balance','operationgrid','functionmachine'\]" assets/99club/games-pdf-v136.js
          grep -q 'FINAL BALANCE - EXAMPLE SOLUTION' assets/99club/games-pdf.js
          grep -q "adapter.title='Balance Lab'" assets/99club/games-balance-lab-v192.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-balance-lab-v192.js assets/99club/games-app.js assets/99club/games-pdf.js assets/99club/games-puzzle-redesign-v136.js assets/99club/games-pdf-v136.js _pages/99-club-games.md _pages/99-club-games-play.md docs/99club/GAMES.md
          git commit -m '[v1.92 integration] Wire Balance Lab into online and printable play'
          git push origin HEAD:feat/balance-lab-v192
