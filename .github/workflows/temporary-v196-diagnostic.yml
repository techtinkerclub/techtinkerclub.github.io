name: v1.96 Colour Logic diagnostic
on:
  push:
    branches: [ feat/colour-logic-mobile-balance-v196 ]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/colour-logic-mobile-balance-v196
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-new-puzzles-v196.js');
          const A=global.TT99ArithmeticGames;
          for(const d of ['easy','standard','challenge'])for(const layout of ['row','grid'])for(const style of ['mixed','position','neighbour','count'])for(let k=0;k<4;k++){
            const p=A.generate('colourlogic',{engineSettings:{colourlogic:{difficulty:d,layout,ruleStyle:style}}},`final-cl-${d}-${layout}-${style}-${k}`);
            if(!p){console.error('NULL CASE',d,layout,style,k);process.exit(2);}
            if(!A.validate(p).ok){console.error('INVALID CASE',d,layout,style,k,JSON.stringify(p));process.exit(3);}
          }
          console.log('No null cases');
          NODE
