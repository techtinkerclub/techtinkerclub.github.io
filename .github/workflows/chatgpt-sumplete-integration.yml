name: ChatGPT Sumplete integration

on:
  push:
    branches:
      - chatgpt/v1.32.0-sumplete
    paths:
      - 'scripts/apply-sumplete-integration.js'
      - '.github/workflows/chatgpt-sumplete-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v1.32.0-sumplete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Sumplete integration patch
        run: node scripts/apply-sumplete-integration.js
      - name: Syntax check patched files
        run: |
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/99club/games-app.js assets/99club/games-pdf.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Sumplete into Games preview and PDF"
          git push origin HEAD:chatgpt/v1.32.0-sumplete
