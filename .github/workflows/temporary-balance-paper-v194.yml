name: Balance Lab paper v1.94

on:
  push:
    branches: [ fix/balance-lab-paper-v193 ]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v1.94 paper]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/balance-lab-paper-v193
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved printable redesign
        run: |
          python assets/99club/tests/apply-balance-paper-v194.py
          python assets/99club/tests/fix-balance-paper-v194-post.py
      - name: Validate JavaScript
        run: |
          node --check assets/99club/games-balance-lab-v192.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
      - name: Validate generated puzzles and PDFs
        run: node assets/99club/tests/generate-balance-paper-v194.js
      - name: Upload Standard sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: balance-lab-paper-v194-standard
          path: /tmp/balance-lab-v194-standard.pdf
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-balance-lab-v192.js assets/99club/games-app.js assets/99club/games-pdf.js assets/99club/games-balance-lab-v192.css _pages/99-club-games.md
          git commit -m '[v1.94 paper] Implement approved Balance Lab printable layout'
          git push origin HEAD:fix/balance-lab-paper-v193
