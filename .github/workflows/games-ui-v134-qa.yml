name: Games UI v1.34 QA

on:
  push:
    branches:
      - chatgpt/v1.34-games-ui-batch
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  games-ui-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax checks
        run: |
          node --check assets/99club/games-ui-v134.js
          node --check assets/99club/games-random-ui.js
          node --check assets/99club/tests/games-ui-v134-smoke.js
      - name: v1.34 focused UI regression
        run: node assets/99club/tests/games-ui-v134-smoke.js
      - name: Core Games regressions
        run: |
          node assets/99club/tests/games-property-maze-smoke.js
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-arithmetic-expansion-smoke.js
          node assets/99club/tests/games-number-structures-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
          node assets/99club/tests/games-smoke.js
