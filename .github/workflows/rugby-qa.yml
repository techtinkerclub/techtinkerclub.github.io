name: Rugby Coaching Studio QA

on:
  push:
    branches: [master]
    paths:
      - 'rugby/**'
      - '.github/workflows/rugby-qa.yml'
  pull_request:
    paths:
      - 'rugby/**'
      - '.github/workflows/rugby-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rugby-studio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rugby-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Rugby Coaching Studio regression tests
        run: node --test rugby/tests/*.test.mjs
