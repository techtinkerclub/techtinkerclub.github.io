name: Apply v1.31.2 patch

on:
  push:
    branches:
      - master
    paths:
      - '.patch-v1312/**'
      - '.github/workflows/apply-v1312.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated v1.31.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch-v1312/chunk-* > /tmp/v1312.patch
          git apply --check /tmp/v1312.patch
          git apply /tmp/v1312.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply 99 Club Studio v1.31.2"
          git push origin master
