name: ChatGPT PDF readability QA

on:
  push:
    branches:
      - chatgpt/v1.31.4-pdf-text-readability

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate all-engine PDF corpus
        shell: bash
        run: |
          mkdir -p qa-output
          node <<'NODE'
          const fs=require('fs');
          const G=require('./assets/99club/games-engine.js');
          const PDF=require('./assets/99club/games-pdf.js');
          const ids=Object.keys(G.ENGINES);
          const base={minYear:6,maxYear:6,topics:Object.keys(G.TOPICS),workedExamples:'none',personalisation:{schoolName:'Readability QA',packTitle:'All puzzle text check'},engineSettings:{}};
          const activities=[];
          for(let i=0;i<ids.length;i++){
            const id=ids[i],s=JSON.parse(JSON.stringify(base));
            s.engineSettings[id]={...(G.ENGINES[id]?.defaultSettings||{}),difficulty:'standard'};
            try{activities.push(G.generateActivity(id,s,`readability-${i}-${id}`));}
            catch(err){console.error(`FAILED ${id}:`,err);process.exitCode=1;}
          }
          if(process.exitCode)process.exit(process.exitCode);
          console.log(`Generated ${activities.length} engines: ${ids.join(', ')}`);
          const paired={seed:'readability-all-engines',sheets:[]};
          for(let i=0;i<activities.length;i+=2)paired.sheets.push({index:paired.sheets.length+1,activities:activities.slice(i,i+2)});
          const doc=PDF.buildDocument({pack:paired,settings:base,kind:'student',topics:G.TOPICS,seed:paired.seed});
          fs.writeFileSync('qa-output/readability-all-engines.pdf',Buffer.from(doc.outputBytes()));
          NODE
          node --check assets/99club/games-pdf.js
          node assets/99club/tests/games-v1302-pdf-parity-smoke.js
          node assets/99club/tests/games-v1304-number-structures-polish-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
          ls -lh qa-output
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-readability-all-engines
          path: qa-output/readability-all-engines.pdf
          retention-days: 2
