name: Fix Symbol Decoder paper v1.90

on:
  push:
    branches: [ fix/symbol-decoder-paper-v190 ]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v1.90 paper fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-decoder-paper-v190
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy Symbol Decoder PDF overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/99club/games-pdf-v136.js')
          t=p.read_text()
          old="function drawOverlay(cmds,a,answers,x,y,w,h,index){if(a.engineId==='balance')return drawRepair(cmds,a,answers,x,y,w,h,index);if(a.engineId==='operationgrid')return drawCode(cmds,a,answers,x,y,w,h,index);if(a.engineId==='symbols')return drawSymbols(cmds,a,answers,x,y,w,h,index);if(a.engineId==='functionmachine')return drawMachine(cmds,a,answers,x,y,w,h,index);}"
          new="function drawOverlay(cmds,a,answers,x,y,w,h,index){if(a.engineId==='balance')return drawRepair(cmds,a,answers,x,y,w,h,index);if(a.engineId==='operationgrid')return drawCode(cmds,a,answers,x,y,w,h,index);if(a.engineId==='functionmachine')return drawMachine(cmds,a,answers,x,y,w,h,index);}"
          if old not in t: raise SystemExit('drawOverlay anchor missing')
          t=t.replace(old,new,1)
          old2="if(['balance','operationgrid','symbols','functionmachine'].includes(a.engineId))drawOverlay(entry.cmds,a,answers,M,bodyTop+i*(ah+gap),w,ah,i+1);"
          new2="if(['balance','operationgrid','functionmachine'].includes(a.engineId))drawOverlay(entry.cmds,a,answers,M,bodyTop+i*(ah+gap),w,ah,i+1);"
          if old2 not in t: raise SystemExit('overlaySheet anchor missing')
          t=t.replace(old2,new2,1)
          t=t.replace(' * Redraws the four redesigned puzzle families on top of the legacy PDF output.',' * Redraws legacy redesigned families on top of the base PDF output.\n * Symbol Decoder is intentionally excluded: games-pdf.js v1.89+ owns its paper layout.')
          p.write_text(t)

          page=Path('_pages/99-club-games.md')
          t=page.read_text()
          old='<script src="/assets/99club/games-pdf-v136.js?v=1"></script>'
          new='<script src="/assets/99club/games-pdf-v136.js?v=2"></script>'
          if old not in t: raise SystemExit('v136 cache anchor missing')
          page.write_text(t.replace(old,new,1))
          PY
      - name: Syntax
        run: |
          node --check assets/99club/games-pdf-v136.js
          node --check assets/99club/games-pdf.js
      - name: PDF Symbol Decoder regression check
        run: |
          node - <<'NODE'
          require('./assets/99club/simple-pdf.js');
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-symbol-decoder-v189.js');
          require('./assets/99club/games-puzzle-redesign-v135-logic.js');
          require('./assets/99club/games-pdf.js');
          require('./assets/99club/games-pdf-v136.js');
          const G=global.TT99Games,PDF=global.TT99GamesPDF;
          for(const difficulty of ['easy','standard','challenge']){
            const settings=G.normalizeSettings({minYear:4,maxYear:6,topics:['algebra','calculation'],sheets:1,activitiesPerSheet:2,selectedEngines:['symbols'],includeAnswers:true,engineSettings:{symbols:{difficulty,theme:'mixed',equationStyle:'auto'}}});
            const pack=G.generatePack(settings,`paper-v190-${difficulty}`);
            const doc=PDF.buildDocument({pack,settings:pack.settings,kind:'both',topics:G.TOPICS||{},seed:pack.seed});
            const commands=doc.pages.flatMap(p=>p.cmds||[]).join('\n');
            if(!commands.includes('SECRET WORD')) throw new Error('new Symbol Decoder paper layout missing');
            if(commands.includes('MYSTERY VALUE')) throw new Error('legacy mystery-value overlay still active');
            const bytes=doc.outputBytes();
            if(bytes.length<5000) throw new Error(`PDF unexpectedly small: ${bytes.length}`);
            console.log(difficulty,bytes.length);
          }
          NODE
      - name: Integration guard
        run: |
          grep -q 'games-pdf-v136.js?v=2' _pages/99-club-games.md
          ! grep -q "\['balance','operationgrid','symbols','functionmachine'\]" assets/99club/games-pdf-v136.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-pdf-v136.js _pages/99-club-games.md
          git commit -m '[v1.90 paper fix] Stop legacy overlay replacing Symbol Decoder'
          git push origin HEAD:fix/symbol-decoder-paper-v190
