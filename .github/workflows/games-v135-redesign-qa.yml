name: Games v1.35 redesign QA

on:
  push:
    branches:
      - chatgpt/v1.35-puzzle-redesigns
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  redesign-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check assets/99club/games-puzzle-redesign-v135.js
          node --check assets/99club/tests/games-v135-redesign-smoke.js
      - name: Redesign smoke
        run: node assets/99club/tests/games-v135-redesign-smoke.js
      - name: Current generator regressions
        run: |
          node assets/99club/tests/games-property-maze-smoke.js
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
          node assets/99club/tests/games-sumplete-smoke.js
