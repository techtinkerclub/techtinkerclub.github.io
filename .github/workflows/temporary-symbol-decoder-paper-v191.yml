name: Symbol Decoder paper v1.91 patch

on:
  push:
    branches:
      - fix/symbol-decoder-paper-v191

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-decoder-paper-v191
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch if needed
        run: |
          if grep -q 'tt99-print-decoder-answer' assets/99club/games-app.js; then
            echo 'Patch already applied'
          else
            python assets/99club/tests/apply-symbol-decoder-v191.py
          fi
      - name: Validate JavaScript
        run: |
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
      - name: Validate generated PDFs
        run: |
          node - <<'NODE'
          require('./assets/99club/simple-pdf.js');
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-symbol-decoder-v189.js');
          require('./assets/99club/games-puzzle-redesign-v135-logic.js');
          require('./assets/99club/games-pdf.js');
          require('./assets/99club/games-pdf-v136.js');
          const G=global.TT99Games,PDF=global.TT99GamesPDF;
          for(const difficulty of ['easy','standard','challenge']){
            const settings=G.normalizeSettings({minYear:4,maxYear:6,topics:['algebra','calculation'],sheets:1,activitiesPerSheet:2,selectedEngines:['symbols'],includeAnswers:true,engineSettings:{symbols:{difficulty,theme:'mixed',equationStyle:'auto'}}});
            const pack=G.generatePack(settings,`paper-v191-${difficulty}`);
            const doc=PDF.buildDocument({pack,settings:pack.settings,kind:'both',topics:G.TOPICS||{},seed:pack.seed});
            const commands=doc.pages.flatMap(p=>p.cmds||[]).join('\n');
            for(const marker of ['SECRET WORD','WRITE THE WORD','LETTER CODE','A=1','Z=26']) if(!commands.includes(marker)) throw new Error(`missing ${marker}`);
            if(commands.includes('MYSTERY VALUE')) throw new Error('legacy Symbol Decoder overlay returned');
            if(doc.outputBytes().length<5000) throw new Error('PDF unexpectedly small');
          }
          console.log('Symbol Decoder paper v1.91 PDF checks passed');
          NODE
      - name: Validate browser-sheet wiring
        run: |
          grep -q 'tt99-print-decoder-answer' assets/99club/games-app.js
          grep -q 'tt99-print-decoder-alphabet' assets/99club/games-app.js
          grep -q 'games-symbol-decoder-v189.css?v=2' _pages/99-club-games.md
          grep -q 'games-pdf.js?v=22' _pages/99-club-games.md
          grep -q 'games-app.js?v=23' _pages/99-club-games.md
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-app.js assets/99club/games-pdf.js assets/99club/games-symbol-decoder-v189.css _pages/99-club-games.md
          git commit -m '[v1.91 paper patch] Add answer row and full alphabet key'
          git push origin HEAD:fix/symbol-decoder-paper-v191
