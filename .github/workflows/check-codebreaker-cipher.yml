name: Check Codebreaker cipher

on:
  push:
    branches:
      - feature/codebreaker-cipher

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check assets/99club/games-play-operationgrid-v1.js
      - name: Validate cipher contracts
        run: |
          node <<'NODE'
          global.localStorage=undefined;
          require('./assets/99club/games-arithmetic.js');
          global.TT99PlayArithmetic={
            label:op=>op==='-'?'−':op,
            esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
          };
          let adapter=null;
          global.TT99GamesPlay={registerAdapter:(id,obj)=>{if(id==='operationgrid')adapter=obj;}};
          require('./assets/99club/games-play-operationgrid-v1.js');
          if(!adapter)throw new Error('adapter not registered');
          const A=global.TT99ArithmeticGames;
          for(const difficulty of ['easy','standard','challenge'])for(let i=0;i<100;i++){
            const p=adapter.createPuzzle({difficulty,rowCount:'auto',operations:'auto'},`cipher:${difficulty}:${i}`);
            const v=A.validate(p);if(!v.ok)throw new Error(`${difficulty}/${i}: ${v.error}`);
          }
          const fs=require('fs'),src=fs.readFileSync('assets/99club/games-play-operationgrid-v1.js','utf8');
          for(const needle of ['Check code','Secret cipher','encryptWord','secretWordFor','if(silent)return {complete:false'])if(!src.includes(needle))throw new Error(`missing ${needle}`);
          if(!src.includes('if(attempt===secretWord)'))throw new Error('secret word is not completion gate');
          if(src.includes('if(!wrong&&!blank)return {complete:true'))throw new Error('equation stage still completes game');
          console.log('validated 300 generated puzzles and cipher two-stage contracts');
          NODE
