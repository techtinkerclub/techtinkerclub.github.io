name: v1.41 Alphametics QA
on:
  push:
    branches: [chatgpt/v141-alphametics-library]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-alphametics-library-v141.js
          node --check assets/99club/games-pdf-v141.js
          node --check assets/99club/tests/games-v141-alphametics-smoke.js
      - name: Alphametics library QA
        run: node assets/99club/tests/games-v141-alphametics-smoke.js
      - name: Existing regressions
        run: |
          node assets/99club/tests/games-v140-puzzle-pack-smoke.js
          node assets/99club/tests/games-v139-takuzu-smoke.js
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
