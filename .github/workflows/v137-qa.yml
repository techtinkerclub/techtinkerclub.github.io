name: v1.37 Games QA
on:
  push:
    branches: [chatgpt/v1.37-number-towers-batch]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-number-towers-v137.js
          node --check assets/99club/games-v137.js
          node --check assets/99club/games-pdf-v137.js
      - name: v1.37 focused QA
        run: node assets/99club/tests/games-v137-number-towers-smoke.js
      - name: Current regressions
        run: |
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-property-maze-smoke.js
          node assets/99club/tests/games-sumplete-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
          node assets/99club/tests/games-v136-redesign-smoke.js
