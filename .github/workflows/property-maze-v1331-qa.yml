name: Property Maze v1.33.1 QA

on:
  push:
    branches:
      - chatgpt/v1.33.1-property-maze-render-fix
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  property-maze-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax checks
        run: |
          node --check assets/99club/games-property-maze.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
          node --check assets/99club/tests/games-property-maze-smoke.js
      - name: Focused Property Maze regression
        run: node assets/99club/tests/games-property-maze-smoke.js
