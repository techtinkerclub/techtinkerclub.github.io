name: Temporary Online Play v1.78 check

on:
  push:
    branches:
      - fix/arithmagon-result-circles-v178

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check assets/99club/games-play-arithmagon-v178.js
      - name: Arithmagon result-node guards
        run: |
          grep -q 'border-radius:50%!important' assets/99club/games-play-arithmagon-v178.css
          grep -q 'width:48px!important' assets/99club/games-play-arithmagon-v178.css
          grep -q 'is-mixed-ops' assets/99club/games-play-arithmagon-v178.css
          grep -q "p?.operationMode==='mixed_within'" assets/99club/games-play-arithmagon-v178.js
          grep -q 'games-play-arithmagon-v178.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-arithmagon-v178.js?v=1' _pages/99-club-games-play.md
