name: Balance Lab paper v1.93

on:
  push:
    branches: [ fix/balance-lab-paper-v193 ]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v1.93 paper]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/balance-lab-paper-v193
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply printable redesign
        run: python assets/99club/tests/apply-balance-paper-v193.py
      - name: Validate JavaScript
        run: |
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
          node --check assets/99club/games-balance-lab-v192.js
      - name: Generate and validate sample PDFs
        run: node assets/99club/tests/generate-balance-paper-v193.js
      - name: Upload sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: balance-lab-paper-v193-sample
          path: /tmp/balance-lab-standard.pdf
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-app.js assets/99club/games-pdf.js assets/99club/games-balance-lab-v192.css _pages/99-club-games.md
          git commit -m '[v1.93 paper] Give Balance Lab named weights and a real final scale'
          git push origin HEAD:fix/balance-lab-paper-v193
