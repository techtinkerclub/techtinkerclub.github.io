name: Load contextual keypad drawer v201

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/use-context-keypad-v201.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch play page to v201 drawer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_pages/99-club-games-play.md')
          s=p.read_text()
          s=s.replace('/assets/99club/games-play-context-keypad-v200.css?v=1','/assets/99club/games-play-context-keypad-v201.css?v=1')
          s=s.replace('/assets/99club/games-play-context-keypad-v200.js?v=2','/assets/99club/games-play-context-keypad-v201.js?v=1')
          p.write_text(s)
          PY
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/use-context-keypad-v201.yml
          git add _pages/99-club-games-play.md
          git commit -m "Use persistent contextual keypad drawer"
          git push origin master
