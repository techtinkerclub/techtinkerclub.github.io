name: Refresh Games help guides v203

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tt99-help-guides-v203.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch help guides
        run: python3 scripts/99club/update-help-v203.py
      - name: Syntax check
        run: node --check assets/99club/games-help-guides.js
      - name: Commit changes
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/tt99-help-guides-v203.yml scripts/99club/update-help-v203.py
          git add assets/99club/games-help-guides.js _pages/99-club-games-help.md
          git commit -m "Add Corner and Linked Sum one-page guides"
          git push origin master
