name: Check print preview v1.55

on:
  push:
    branches:
      - feature/print-preview-pager-v155

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check new scripts
        run: |
          node --check assets/99club/games-preview-pager-v155.js
          node --check assets/99club/games-operationgrid-print-v155.js
          node --check assets/99club/games-operationgrid-print-v155-ui.js
          node --check assets/99club/games-pdf-v155.js
      - name: Verify virtualised 20 plus 20 preview source
        run: |
          node <<'NODE'
          let native='';const proto={get innerHTML(){return native;},set innerHTML(v){native=String(v);}};const root=Object.create(proto);Object.defineProperty(root,'innerHTML',{configurable:true,get(){return 'old-trimmed';},set(){}});root.__tt99PreviewLimiter=true;root.querySelector=()=>null;root.querySelectorAll=()=>[];
          global.document={getElementById:()=>root,readyState:'complete'};global.requestAnimationFrame=()=>1;global.MutationObserver=class{observe(){}};
          require('./assets/99club/games-preview-pager-v155.js');
          const pupil=Array.from({length:20},(_,i)=>`<article class="tt99-game-paper"><p>P${i+1}</p></article>`).join('');
          const answers=Array.from({length:20},(_,i)=>`<article class="tt99-game-paper is-answer"><p>A${i+1}</p></article>`).join('');
          root.innerHTML=`<div class="tt99-games-pupil-pages">${pupil}</div><div class="tt99-games-answer-pages">${answers}</div>`;
          const api=global.TT99GamesPreviewPagerV155;if(api.counts.pupil!==20||api.counts.answers!==20)throw new Error(`stored ${api.counts.pupil}+${api.counts.answers}, expected 20+20`);
          const mounted=(native.match(/<article class=/g)||[]).length;if(mounted!==2)throw new Error(`virtualised HTML mounted ${mounted} articles, expected 2`);
          if(!native.includes('P1')||!native.includes('A1')||native.includes('P20')||native.includes('A20'))throw new Error('wrong pages retained in initial DOM');
          const out=api.virtualizeHTML(`<article class="tt99-game-paper tt99-worked-page">W</article>${pupil}<article class="tt99-game-paper is-answer">A</article>`);if(out.pages.pupil.length!==21||out.pages.answers.length!==1)throw new Error('worked-page classification failed');
          console.log('20 pupil + 20 answer source pages retained with only 2 mounted articles');
          NODE
      - name: Verify Codebreaker print cipher
        run: |
          node <<'NODE'
          require('./assets/99club/games-arithmetic.js');require('./assets/99club/games-operationgrid-v153.js');require('./assets/99club/games-operationgrid-print-v155.js');
          const A=global.TT99ArithmeticGames,C=A.OPERATIONGRID_PRINT_V155;
          for(const difficulty of ['easy','standard','challenge'])for(let i=0;i<80;i++){
            const settings={minYear:1,maxYear:6,engineSettings:{operationgrid:{difficulty,rowCount:'6',operations:'auto',missingOps:'auto',structure:'auto'}}},p=A.generate('operationgrid',settings,`print-test:${difficulty}:${i}`),q=p.printCipher;if(!A.validate(p).ok||!q)throw new Error('invalid print puzzle');if(q.word.length>1&&(!q.moves.some(m=>m.direction>0)||!q.moves.some(m=>m.direction<0)))throw new Error('one-direction cipher');const decoded=q.cipher.split('').map((ch,j)=>C.shiftChar(ch,q.moves[j].direction*q.moves[j].digit)).join('');if(decoded!==q.word)throw new Error('cipher round trip failed');
          }
          if(C.shiftChar('Z',1)!=='A'||C.shiftChar('A',-1)!=='Z')throw new Error('wraparound failed');console.log('240 printable Codebreakers validated');
          NODE
      - name: Verify 40-puzzle PDFs and numbering
        run: |
          node <<'NODE'
          require('./assets/99club/simple-pdf.js');require('./assets/99club/games-arithmetic.js');require('./assets/99club/games-operationgrid-v153.js');require('./assets/99club/games-operationgrid-print-v155.js');require('./assets/99club/games-pdf.js');require('./assets/99club/games-pdf-v155.js');
          const A=global.TT99ArithmeticGames,PDF=global.TT99GamesPDF,settings={minYear:1,maxYear:6,topics:[],workedExamples:'none',personalisation:{},engineSettings:{operationgrid:{difficulty:'standard',rowCount:'6',operations:'auto',missingOps:'auto',structure:'auto'}}},sheets=[];for(let s=0;s<20;s++){const activities=[];for(let a=0;a<2;a++)activities.push(A.generate('operationgrid',settings,`pack40:${s}:${a}`));sheets.push({index:s+1,activities});}const pack={seed:'PACK40',sheets,workedExamples:[]};
          for(const [kind,want] of [['student',20],['answers',20],['both',40]]){const doc=PDF.buildDocument({pack,settings,kind,topics:{},seed:'PACK40'});if(doc.pages.length!==want)throw new Error(`${kind}: ${doc.pages.length}/${want}`);doc.pages.forEach((entry,i)=>{const stream=(entry.cmds||entry).join('\n');if(!stream.includes(`Page ${i+1} of ${want}`)||!stream.includes('OPERATOR KEY')||!stream.includes('SECRET WORD')||stream.includes('TT99OC155'))throw new Error(`${kind} page ${i+1} finishing layer failed`);});if(doc.outputBytes().length<1000)throw new Error('invalid PDF bytes');}
          console.log('20 pupil + 20 answer sheets and 40-page combined PDF verified');
          NODE
      - name: Verify page wiring
        run: |
          grep -q 'games-preview-pager-v155.css' _pages/99-club-games.md
          grep -q 'games-preview-pager-v155.js' _pages/99-club-games.md
          grep -q 'games-operationgrid-print-v155.js' _pages/99-club-games.md
          grep -q 'games-operationgrid-print-v155-ui.js' _pages/99-club-games.md
          grep -q 'games-pdf-v155.js' _pages/99-club-games.md
