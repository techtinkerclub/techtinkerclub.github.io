name: Check print preview v1.55

on:
  push:
    branches:
      - feature/print-preview-pager-v155

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check new scripts
        run: |
          node --check assets/99club/games-preview-pager-v155.js
          node --check assets/99club/games-operationgrid-print-v155.js
          node --check assets/99club/games-operationgrid-print-v155-ui.js
          node --check assets/99club/games-pdf-v155.js
      - name: Verify Codebreaker print cipher
        run: |
          node <<'NODE'
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-operationgrid-v153.js');
          require('./assets/99club/games-operationgrid-print-v155.js');
          const A=global.TT99ArithmeticGames,C=A.OPERATIONGRID_PRINT_V155;
          for(const difficulty of ['easy','standard','challenge'])for(let i=0;i<80;i++){
            const settings={minYear:1,maxYear:6,engineSettings:{operationgrid:{difficulty,rowCount:'6',operations:'auto',missingOps:'auto',structure:'auto'}}};
            const p=A.generate('operationgrid',settings,`print-test:${difficulty}:${i}`),q=p.printCipher;
            if(!A.validate(p).ok||!q)throw new Error('missing/invalid print cipher puzzle');
            if(q.word.length>1&&(!q.moves.some(m=>m.direction>0)||!q.moves.some(m=>m.direction<0)))throw new Error('cipher lacks both directions');
            const decoded=q.cipher.split('').map((ch,j)=>C.shiftChar(ch,q.moves[j].direction*q.moves[j].digit)).join('');
            if(decoded!==q.word)throw new Error(`${q.cipher} decoded to ${decoded}, expected ${q.word}`);
            if(!/\[\[TT99OC155:/.test(p.instruction))throw new Error('browser payload marker missing');
          }
          if(C.shiftChar('Z',1)!=='A'||C.shiftChar('A',-1)!=='Z')throw new Error('wraparound failed');
          console.log('240 printable Codebreakers validated');
          NODE
      - name: Verify 40-puzzle PDF counts, overlays and numbering
        run: |
          node <<'NODE'
          require('./assets/99club/simple-pdf.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-operationgrid-v153.js');
          require('./assets/99club/games-operationgrid-print-v155.js');
          require('./assets/99club/games-pdf.js');
          require('./assets/99club/games-pdf-v155.js');
          const A=global.TT99ArithmeticGames,PDF=global.TT99GamesPDF;
          const settings={minYear:1,maxYear:6,topics:[],workedExamples:'none',personalisation:{},engineSettings:{operationgrid:{difficulty:'standard',rowCount:'6',operations:'auto',missingOps:'auto',structure:'auto'}}};
          const sheets=[];for(let s=0;s<20;s++){const activities=[];for(let a=0;a<2;a++)activities.push(A.generate('operationgrid',settings,`pack40:${s}:${a}`));sheets.push({index:s+1,activities});}
          const pack={seed:'PACK40',sheets,workedExamples:[]};
          for(const [kind,want] of [['student',20],['answers',20],['both',40]]){
            const doc=PDF.buildDocument({pack,settings,kind,topics:{},seed:'PACK40'});
            if(doc.pages.length!==want)throw new Error(`${kind} pages ${doc.pages.length}, expected ${want}`);
            doc.pages.forEach((entry,i)=>{const stream=(entry.cmds||entry).join('\n');if(!stream.includes(`Page ${i+1} of ${want}`))throw new Error(`${kind} page ${i+1} lacks page number`);if(!stream.includes('OPERATOR KEY')||!stream.includes('SECRET WORD'))throw new Error(`${kind} page ${i+1} lacks v1.55 Codebreaker overlay`);if(stream.includes('TT99OC155'))throw new Error(`${kind} leaked payload marker`);});
            const bytes=doc.outputBytes();if(!bytes||bytes.length<1000)throw new Error(`${kind} PDF bytes invalid`);
          }
          console.log('20 pupil + 20 answer sheets verified; PDFs numbered and Codebreaker overlay present');
          NODE
      - name: Verify preview limiter retirement and page wiring
        run: |
          node <<'NODE'
          let ownValue='trimmed';const proto={get innerHTML(){return this._v||'';},set innerHTML(v){this._v=v;}};const root=Object.create(proto);Object.defineProperty(root,'innerHTML',{configurable:true,get(){return ownValue;},set(v){ownValue=v;}});root.__tt99PreviewLimiter=true;root.querySelector=()=>null;root.querySelectorAll=()=>[];
          global.document={getElementById:()=>root,readyState:'complete'};global.requestAnimationFrame=()=>1;global.MutationObserver=class{observe(){}};
          require('./assets/99club/games-preview-pager-v155.js');
          if(Object.prototype.hasOwnProperty.call(root,'innerHTML'))throw new Error('old preview limiter setter was not removed');
          root.innerHTML='full';if(root._v!=='full')throw new Error('native/prototype innerHTML not restored');
          console.log('old preview trimming interception retired successfully');
          NODE
          grep -q 'games-preview-pager-v155.css' _pages/99-club-games.md
          grep -q 'games-preview-pager-v155.js' _pages/99-club-games.md
          grep -q 'games-operationgrid-print-v155.js' _pages/99-club-games.md
          grep -q 'games-operationgrid-print-v155-ui.js' _pages/99-club-games.md
          grep -q 'games-pdf-v155.js' _pages/99-club-games.md
