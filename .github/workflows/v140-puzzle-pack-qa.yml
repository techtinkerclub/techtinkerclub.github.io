name: v1.40 puzzle pack QA
on:
  push:
    branches: [chatgpt/v140-four-puzzle-engines]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-puzzle-pack-v140.js
          node --check assets/99club/games-puzzle-pack-v140-hashi.js
          node --check assets/99club/games-puzzle-pack-v140-ui.js
          node --check assets/99club/games-pdf-v140.js
      - name: v1.40 puzzle tests
        run: node assets/99club/tests/games-v140-puzzle-pack-smoke.js
      - name: Existing regressions
        run: |
          node assets/99club/tests/games-v139-takuzu-smoke.js
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-property-maze-smoke.js
          node assets/99club/tests/games-sumplete-smoke.js
          node assets/99club/tests/games-random-pack-smoke.js
      - name: Build implementation QA PDF
        run: node assets/99club/tests/build-v140-puzzle-qa-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: v140-puzzle-qa
          path: artifacts/v140-puzzle-qa.pdf
