name: Apply Symbol Decoder v1.89 source patch

on:
  push:
    branches: [ feat/symbol-decoder-print-v189 ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v1.89 source patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/symbol-decoder-print-v189
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: |
          sed -i 's/re.subn(pat,new,text/re.subn(pat,lambda _m:new,text/g' assets/99club/tests/apply-symbol-decoder-v189.py
          python assets/99club/tests/apply-symbol-decoder-v189.py
      - name: Syntax and generation checks
        run: |
          node --check assets/99club/games-symbol-decoder-v189.js
          node --check assets/99club/games-play-symbol-decoder-v189.js
          node --check assets/99club/games-app.js
          node --check assets/99club/games-pdf.js
          node - <<'NODE'
          require('./assets/99club/games-vocabulary.js');
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-number-logic.js');
          require('./assets/99club/games-engine.js');
          require('./assets/99club/games-symbol-decoder-v189.js');
          const G=global.TT99Games,A=global.TT99ArithmeticGames,D=global.TT99SymbolDecoder;
          if(!D) throw new Error('shared decoder missing');
          let count=0;
          for(const difficulty of ['easy','standard','challenge']) for(const theme of ['maths','science','mixed']) for(let i=0;i<20;i++){
            const settings=G.normalizeSettings({minYear:4,maxYear:6,topics:['algebra','calculation'],selectedEngines:['symbols'],engineSettings:{symbols:{difficulty,theme,equationStyle:'auto'}}});
            const p=G.generateActivity('symbols',settings,`v189-${difficulty}-${theme}-${i}`);
            if(p.error||p.title!=='Symbol Decoder'||!p.word||!p.definition||p.code.length!==p.word.length) throw new Error(JSON.stringify(p));
            if(!A.validate(p).ok) throw new Error('decoder validation failed');
            if(new Set(p.word).size!==p.symbols.length) throw new Error('symbol mapping mismatch');
            count++;
          }
          const maths=D.bank('maths','standard').length,science=D.bank('science','standard').length,mixed=D.bank('mixed','standard').length;
          if(maths<100||science<25||mixed<150) throw new Error(`word bank too small ${maths}/${science}/${mixed}`);
          console.log(`Generated ${count} decoder puzzles; standard banks maths=${maths}, science=${science}, mixed=${mixed}`);
          NODE
      - name: Integration guards
        run: |
          grep -q 'games-symbol-decoder-v189.js?v=1' _pages/99-club-games.md
          grep -q 'games-symbol-decoder-v189.css?v=1' _pages/99-club-games.md
          grep -q 'games-symbol-decoder-v189.js?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-symbol-decoder-v189.js?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-symbol-decoder-v189.css?v=1' _pages/99-club-games-play.md
          grep -q 'tt99-symbol-decoder-print' assets/99club/games-app.js
          grep -q 'PDF symbols are drawn as vector shapes' docs/99club/GAMES.md
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/99club/games-symbol-decoder-v189.js assets/99club/games-play-symbol-decoder-v189.js assets/99club/games-app.js assets/99club/games-pdf.js _pages/99-club-games.md _pages/99-club-games-play.md docs/99club/GAMES.md
          git commit -m '[v1.89 source patch] Share Symbol Decoder across online and paper'
          git push origin HEAD:feat/symbol-decoder-print-v189
