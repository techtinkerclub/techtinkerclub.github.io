name: Heating controller website documentation QA
on:
  push:
    paths:
      - 'heater/index.html'
      - 'heater/electrical/index.html'
      - 'heater/omron-programming/index.html'
      - 'heater/program-tools/index.html'
      - 'heater/programming-assistant/**'
      - 'heater/assets/site-search*.js'
      - 'heater/assets/build-search.mjs'
      - 'heater/development/**'
      - 'heater/omron-atlas/**'
      - '.github/workflows/heater-documentation-qa.yml'
  pull_request:
    paths:
      - 'heater/index.html'
      - 'heater/electrical/index.html'
      - 'heater/omron-programming/index.html'
      - 'heater/program-tools/index.html'
      - 'heater/programming-assistant/**'
      - 'heater/assets/site-search*.js'
      - 'heater/assets/build-search.mjs'
      - 'heater/development/**'
      - 'heater/omron-atlas/**'
      - '.github/workflows/heater-documentation-qa.yml'
jobs:
  documentation-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight DOM test environment
        run: npm install --no-save --ignore-scripts jsdom@26
      - name: Check the offline search catalogue is current
        run: node heater/assets/build-search.mjs --check
      - name: Test parameter atlas and website navigation
        run: node heater/omron-atlas/check-atlas.mjs
