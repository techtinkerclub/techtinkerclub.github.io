name: v1.38 QA PDF
on:
  push:
    branches: [chatgpt/v138-code-machine-refinement]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-v138.js
          node --check assets/99club/games-pdf-v138.js
      - name: Generate QA PDF
        run: node assets/99club/tests/build-v138-qa-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: v138-qa-pdf
          path: artifacts/v138-code-machine-qa.pdf
