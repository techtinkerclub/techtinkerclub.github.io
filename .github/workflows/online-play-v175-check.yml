name: Temporary Online Play v1.75 check

on:
  push:
    branches:
      - fix/pwa-no-zoom-input-capture-v175

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-play-number-structures-v174-fix.js
          node --check assets/99club/games-play-share-v164.js
          node --check assets/99club/games-play-completion-preview-v1.js
          node --check assets/99club/pwa/pwa-register.js
          node --check tools/99-club/sw.js
      - name: Mobile focus, capture and PWA guards
        run: |
          grep -q 'pointerdown' assets/99club/games-play-number-structures-v174-fix.js
          grep -q 'inputmode.*none' assets/99club/games-play-number-structures-v174-fix.js
          grep -q 'el.focus=function' assets/99club/games-play-number-structures-v174-fix.js
          grep -q 'tt99-entry-host-active' assets/99club/games-play-polish-v174.css
          grep -q 'tt99-capture-value' assets/99club/games-play-polish-v174.css
          grep -q 'freezeStructureInputs' assets/99club/games-play-share-v164.js
          grep -q 'freezeStructureInputs' assets/99club/games-play-completion-preview-v1.js
          grep -q 'maximum-scale=1' assets/99club/pwa/pwa-register.js
          grep -q 'user-scalable=no' assets/99club/pwa/pwa-register.js
          grep -q 'gesturestart' assets/99club/pwa/pwa-register.js
          grep -q 'touch-action:pan-x pan-y' assets/99club/pwa/pwa.css
          grep -q 'pwa.css?v=4' _includes/head/custom.html
          grep -q 'pwa-register.js?v=4' _includes/head/custom.html
          grep -q "tt99-studio-'+'v1.0.4" tools/99-club/sw.js || grep -q "v1.0.4" tools/99-club/sw.js
          grep -q 'games-play-polish-v174.css?v=2' _pages/99-club-games-play.md
          grep -q 'games-play-number-structures-v174-fix.js?v=2' _pages/99-club-games-play.md
          grep -q 'games-play-completion-preview-v1.js?v=3' _pages/99-club-games-play.md
          grep -q 'games-play-share-v164.js?v=3' _pages/99-club-games-play.md
