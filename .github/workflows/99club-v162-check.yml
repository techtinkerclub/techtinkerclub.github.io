name: 99 Club v1.62 checks
on:
  pull_request:
    branches: [master]
    paths:
      - 'assets/99club/**'
      - '_includes/head/custom.html'
      - '.github/workflows/99club-v162-check.yml'
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/99club/games-selector-ux-v162.js
          node --check assets/99club/games-pdf-v162.js
          node --check assets/99club/games-play-feedback-v162.js
          node --check assets/99club/games-play-share-v162.js
          node --check assets/99club/games-play-share-v162-guard.js
          node --check assets/99club/pwa/pwa-register.js
      - name: Check v1.62 loaders
        run: |
          grep -q 'games-pdf-v162.js' _includes/head/custom.html
          grep -q 'games-selector-ux-v162.js' _includes/head/custom.html
          grep -q 'games-play-ux-v162.css' _includes/head/custom.html
          grep -q 'games-play-feedback-v162.js' _includes/head/custom.html
          grep -q 'games-play-share-v162.js' _includes/head/custom.html
          grep -q 'games-play-share-v162-guard.js' _includes/head/custom.html
          grep -q 'pwa.css?v=2' _includes/head/custom.html
          grep -q 'pwa-register.js?v=2' _includes/head/custom.html
      - name: Check key UX contracts
        run: |
          grep -q 'option\[value="3"\]' assets/99club/games-selector-ux-v162.js
          grep -q 'tt99-standalone' assets/99club/pwa/pwa-register.js
          grep -q 'tt99-standalone .masthead' assets/99club/pwa/pwa.css
          grep -q 'drawChallengePanel' assets/99club/games-play-share-v162.js
          grep -q 'data-social="instagram"' assets/99club/games-play-share-v162.js
