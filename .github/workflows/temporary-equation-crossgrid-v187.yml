name: Equation Crossgrid v1.87 checks

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/99club/games-play-equationcrossgrid-v187.js
          node --check assets/99club/tests/games-play-equationcrossgrid-v187-smoke.js
      - name: Active-grid regression test
        run: node assets/99club/tests/games-play-equationcrossgrid-v187-smoke.js
      - name: Online wiring guards
        run: |
          grep -q 'games-crossgrid-v1321.js?v=3' _pages/99-club-games-play.md
          grep -q 'games-play-equationcrossgrid-v187.js?v=1' _pages/99-club-games-play.md
          grep -q "SIZES=\['auto','5','7','9'\]" assets/99club/games-play-equationcrossgrid-v187.js
