name: Temporary Online Play v1.74 check
on:
  push:
    branches:
      - fix/share-and-v173-input-polish
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-play-number-structures-v174-fix.js
          node --check assets/99club/games-play-share-codec-v156.js
          node --check assets/99club/games-play-share-v164.js
          node --check assets/99club/games-play-completion-preview-v1.js
      - name: Wiring and feature guards
        run: |
          grep -q 'games-play-polish-v174.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-number-structures-v174-fix.js?v=1' _pages/99-club-games-play.md
          grep -q 'Starting square' assets/99club/games-play-number-structures-v174-fix.js
          grep -q 'tt99-structure-keypad' assets/99club/games-play-number-structures-v174-fix.js
          grep -q "'/c/?c='" assets/99club/games-play-share-codec-v156.js || grep -q '/c/?c=' assets/99club/games-play-share-codec-v156.js
          grep -q 'blur(34px)' assets/99club/games-play-share-v164.js
          grep -q 'CAPTURE_TARGETS' assets/99club/games-play-share-v164.js
          grep -q 'clearTransient(source)' assets/99club/games-play-completion-preview-v1.js
          test -f _pages/99-club-challenge.md
