name: Repository healthcheck

on:
  push:
    branches:
      - chatgpt/repo-healthcheck-docs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/99club -type f -name '*.js' -not -path '*/tests/archive/*' -print0 | sort -z)

          for file in custom-app.js custom-coordinates.js custom-graphs.js custom-piecharts.js custom-visual-smoke.js; do
            if [ -f "$file" ]; then
              echo "Checking legacy root file $file"
              node --check "$file"
            fi
          done

      - name: JSON syntax audit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const files=cp.execSync("find . -type f -name '*.json' -not -path './node_modules/*' -not -path './vendor/*' -print",{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          for(const file of files){ console.log('Parsing',file); JSON.parse(fs.readFileSync(file,'utf8')); }
          NODE

      - name: Run current 99 Club tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in assets/99club/tests/*.js; do
            [ -f "$test" ] || continue
            count=$((count+1))
            echo "===== TEST $count: $test ====="
            node "$test"
          done
          echo "Executed $count current tests; failures: 0"
          test "$count" -ge 20

      - name: Documentation hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t root_md < <(find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)
          printf 'Root Markdown files:\n%s\n' "${root_md[*]}"
          expected=(99-club-custom.md 99-club-help.md README.md index.md)
          test "${root_md[*]}" = "${expected[*]}"
          test -f docs/README.md
          test -f docs/99club/README.md
          test -f docs/99club/GAMES.md
          test -f docs/99club/CURRICULUM.md
          test -f docs/99club/CUSTOM_WORKSHEETS.md
          test -f docs/archive/README.md
