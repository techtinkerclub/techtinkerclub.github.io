name: Repository healthcheck

on:
  push:
    branches:
      - chatgpt/repo-healthcheck-docs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/99club -type f -name '*.js' -print0 | sort -z)

          for file in custom-app.js custom-coordinates.js custom-graphs.js custom-piecharts.js custom-visual-smoke.js; do
            if [ -f "$file" ]; then
              echo "Checking legacy root file $file"
              node --check "$file"
            fi
          done

      - name: JSON syntax audit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const files=cp.execSync("find . -type f -name '*.json' -not -path './node_modules/*' -not -path './vendor/*' -print",{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          for(const file of files){
            console.log('Parsing',file);
            JSON.parse(fs.readFileSync(file,'utf8'));
          }
          NODE

      - name: Run every 99 Club test
        shell: bash
        run: |
          set +e
          failures=0
          count=0
          for test in assets/99club/tests/*.js; do
            [ -f "$test" ] || continue
            count=$((count+1))
            echo
            echo "===== TEST $count: $test ====="
            node "$test"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "FAIL: $test (exit $rc)"
              failures=$((failures+1))
            else
              echo "PASS: $test"
            fi
          done
          echo
          echo "Executed $count tests; failures: $failures"
          exit $failures

      - name: Documentation inventory
        if: always()
        shell: bash
        run: |
          echo 'Root Markdown files:'
          find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort
          echo
          echo 'Documentation Markdown files:'
          find docs -type f -name '*.md' -printf '%p\n' 2>/dev/null | sort || true
          echo
          echo '99 Club Markdown files under assets:'
          find assets/99club -maxdepth 1 -type f -name '*.md' -printf '%p\n' | sort
