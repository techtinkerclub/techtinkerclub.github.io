name: 99 Club Legacy Redirect QA

on:
  push:
    branches: [master]
    paths:
      - '_pages/99-club*.md'
      - '99-club-*.md'
      - '.github/workflows/99club-qa.yml'
  pull_request:
    paths:
      - '_pages/99-club*.md'
      - '99-club-*.md'
      - '.github/workflows/99club-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 99club-legacy-redirects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy 99 Club redirects
        shell: python
        run: |
          from pathlib import Path

          expected = {
              "_pages/99-club.md": "https://99studio.uk/",
              "_pages/99-club-custom.md": "https://99studio.uk/tools/99-club/custom/",
              "_pages/99-club-games.md": "https://99studio.uk/tools/99-club/games/",
              "_pages/99-club-games-play.md": "https://99studio.uk/tools/99-club/games/play/",
              "_pages/99-club-games-help.md": "https://99studio.uk/tools/99-club/games/help/",
              "_pages/99-club-help.md": "https://99studio.uk/tools/99-club/help/",
              "_pages/99-club-challenge.md": "https://99studio.uk/c/",
              "99-club-custom.md": "https://99studio.uk/tools/99-club/custom/",
              "99-club-help.md": "https://99studio.uk/tools/99-club/help/",
          }

          failures = []
          for filename, target in expected.items():
              path = Path(filename)
              if not path.exists():
                  failures.append(f"{filename}: missing")
                  continue
              text = path.read_text(encoding="utf-8")
              checks = {
                  "target": target in text,
                  "noindex": 'noindex,follow' in text,
                  "canonical": f'rel="canonical" href="{target}"' in text,
                  "javascript redirect": "window.location.replace" in text,
                  "query preserved": "window.location.search" in text,
                  "hash preserved": "window.location.hash" in text,
                  "no legacy app assets": "/assets/99club/" not in text,
              }
              for label, ok in checks.items():
                  if not ok:
                      failures.append(f"{filename}: {label} check failed")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {len(expected)} legacy redirects to 99studio.uk.")
