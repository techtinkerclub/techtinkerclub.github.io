name: v1.37 QA PDF
on:
  push:
    branches: [chatgpt/v137-qa-pdf]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate QA PDF
        run: node assets/99club/tests/build-v137-qa-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: v137-qa-pdf
          path: artifacts/v137-games-qa-pack.pdf
