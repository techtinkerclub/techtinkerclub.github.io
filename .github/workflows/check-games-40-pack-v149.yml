name: Check Games 40-pack v1.49

on:
  push:
    branches:
      - fix/games-40-pack-numbertowers-performance

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check assets/99club/games-performance-v149.js
      - name: Behaviour, validation and performance checks
        run: |
          node <<'NODE'
          const {performance}=require('node:perf_hooks');
          global.localStorage=undefined;
          const load=[
            'games-vocabulary.js','games-arithmetic.js','games-crossgrid-v1321.js','games-property-maze.js','games-number-logic.js',
            'games-takuzu-v139.js','games-takuzu-v139-logic.js','games-puzzle-pack-v140.js','games-puzzle-pack-v140-hashi.js',
            'games-alphametics-library-v141.js','games-number-towers-v137.js','games-number-towers-v137-unique.js','games-number-path-v2.js',
            'games-sumplete.js','games-shikaku-v143.js','games-sum-grids-v147.js','games-engine.js','games-focus-topics-v145.js',
            'games-pack-mode.js','games-performance-v142.js','games-performance-v149.js'
          ];
          for(const f of load) require('./assets/99club/'+f);
          const G=global.TT99Games,NL=global.TT99NumberLogicGames;
          const towerSettings={minYear:1,maxYear:6,topics:['number_place_value'],focusTopics:['spatial_grids'],packMode:'manual',activityCount:1,selectedEngines:['numbertowers'],workedExamples:'none',engineSettings:{numbertowers:{difficulty:'challenge',gridSize:'auto',clueLevel:'auto'}}};

          // A one-off activity must retain the original generator.
          const single=G.generateActivity('numbertowers',G.normalizeSettings(towerSettings),'v149:single',[]);
          if(single.engineVersion==='1.49-fast-pack')throw new Error('Fast template leaked into one-off generation');
          console.log('one-off generator preserved');

          // Exercise the overlay directly under the same large-pack flag and find all three templates.
          const seen=new Map();
          G.__fastPackGeneration=true;
          for(let i=0;i<30&&seen.size<3;i++){
            const a=NL.generate('numbertowers',G.normalizeSettings(towerSettings),`v149:template:${i}`);
            if(a.engineVersion!=='1.49-fast-pack')throw new Error('Large-pack Challenge Number Towers missed fast path');
            const key=JSON.stringify(a.solutionGrid);
            if(!seen.has(key))seen.set(key,a);
          }
          G.__fastPackGeneration=false;
          if(seen.size!==3)throw new Error(`Expected 3 deterministic fast templates, saw ${seen.size}`);
          let ti=0;
          for(const a of seen.values()){
            const t0=performance.now(),v=NL.validate(a),dt=performance.now()-t0;
            if(!v.ok)throw new Error(`Fast template ${ti} failed existing validator: ${v.error}`);
            const visible=['top','right','bottom','left'].reduce((n,s)=>n+a.clues[s].filter(Boolean).length,0);
            if(visible!==16)throw new Error(`Fast template ${ti} has ${visible} visible clues, expected 16`);
            console.log(`template ${++ti}: validator ${dt.toFixed(1)} ms, ${visible}/24 clues`);
          }

          // Large manual Number Towers pack should use only the fast path.
          const largeSettings={...towerSettings,activityCount:40};
          const tLarge=performance.now(),large=G.generatePack(largeSettings,'v149:large',[]),largeMs=performance.now()-tLarge;
          const towerActivities=large.sheets.flatMap(s=>s.activities);
          if(towerActivities.length!==40)throw new Error(`Large manual pack produced ${towerActivities.length} activities`);
          if(towerActivities.some(a=>a.engineVersion!=='1.49-fast-pack'))throw new Error('Large manual Number Towers pack used slow generator');
          console.log(`manual Challenge Number Towers 40: ${largeMs.toFixed(1)} ms`);

          // Reproduce the real random mixed 40 path across multiple deterministic seeds.
          const allFocus=Object.keys(G.FOCUS_TOPICS||{}),base={packMode:'random',activityCount:40,focusTopics:allFocus,topics:['calculation'],workedExamples:'none',selectedEngines:[],engineSettings:{},randomDifficulty:'mixed',randomDifficultyWeights:{easy:25,standard:50,challenge:25}};
          const times=[];
          for(let i=0;i<10;i++){
            G.PERFORMANCE?.clearCache?.();
            const t0=performance.now(),p=G.generatePack(base,`v149:mixed:${i}`,[]),dt=performance.now()-t0;
            const count=p.sheets.reduce((n,s)=>n+s.activities.length,0);
            if(count!==40)throw new Error(`Mixed pack ${i} produced ${count} activities`);
            times.push(dt);console.log(`random Mixed 40 #${i+1}: ${dt.toFixed(1)} ms`);
          }
          const avg=times.reduce((a,b)=>a+b,0)/times.length,max=Math.max(...times);
          console.log(`Random Mixed 40 summary: avg=${avg.toFixed(1)} ms max=${max.toFixed(1)} ms`);
          // Keep a generous regression ceiling for shared CI. The pre-fix master hit 5.8 s.
          if(max>2500)throw new Error(`Random Mixed 40 remains too slow: ${max.toFixed(1)} ms`);
          NODE
