name: Bump mobile QA polish v202

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tt99-bump-mobile-polish-v202.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump stylesheet version
        run: sed -i 's#games-play-context-keypad-v201.css?v=1#games-play-context-keypad-v201.css?v=2#' _pages/99-club-games-play.md
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/tt99-bump-mobile-polish-v202.yml
          git add _pages/99-club-games-play.md
          git commit -m "Bump mobile play polish stylesheet"
          git push origin master
