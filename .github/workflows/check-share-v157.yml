name: Check share capture v1.57
on:
  push:
    branches: [fix/share-card-capture-v157]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check assets/99club/games-play-share-v157.js
      - name: Verify page wiring
        run: |
          grep -q 'html2canvas@1.4.1' _pages/99-club-games-play.md
          grep -q 'games-play-share-v157.js' _pages/99-club-games-play.md
          ! grep -q 'games-play-share-v156.js?v=1' _pages/99-club-games-play.md
          python - <<'PY'
          from pathlib import Path
          s=Path('_pages/99-club-games-play.md').read_text()
          assert s.index('html2canvas@1.4.1') < s.index('games-play-share-v157.js')
          print('capture script order verified')
          PY
      - name: Verify no-dead-download fallback
        run: |
          grep -q "retrying without board" assets/99club/games-play-share-v157.js
          grep -q "captureBoard:false" assets/99club/games-play-share-v157.js
          grep -q "Canvas returned an empty PNG" assets/99club/games-play-share-v157.js
          grep -q "currentBlob=blob" assets/99club/games-play-share-v157.js
          grep -q "board capture failed; using card fallback" assets/99club/games-play-share-v157.js
