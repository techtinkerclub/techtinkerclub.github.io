name: Build portable E5CC-T Studio for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'heater/omron-uploader/**'
      - '.github/workflows/build-omron-uploader.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyinstaller pyserial
      - name: Test protocol and model
        run: python -m unittest discover -s heater/omron-uploader/tests -v
      - name: Build offline executable
        working-directory: heater/omron-uploader
        run: python -m PyInstaller --onefile --windowed --hidden-import serial.tools.list_ports --name E5CC-Programme-Studio --clean app.py
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item heater/omron-uploader/dist/E5CC-Programme-Studio.exe portable/
          Copy-Item heater/omron-uploader/START_*.cmd portable/
          Copy-Item heater/omron-uploader/README.md portable/
          Compress-Archive -Path portable/* -DestinationPath E5CC-T-Programme-Studio-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: E5CC-T-Programme-Studio-Windows
          path: E5CC-T-Programme-Studio-Windows.zip
