name: Finalize calculator precedence and keypad UX
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tt99-precedence-keypad-finalize.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page includes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          play=Path('_pages/99-club-games-play.md')
          s=play.read_text()
          s=s.replace('/assets/99club/games-brokencalc-quality-v152.js?v=1','/assets/99club/games-brokencalc-quality-v152.js?v=2')
          s=s.replace('/assets/99club/games-play-brokencalc-v1.js?v=4','/assets/99club/games-play-brokencalc-v1.js?v=5')
          css='<link rel="stylesheet" href="/assets/99club/games-play-context-keypad-v200.css?v=1">'
          if css not in s:
              anchor='<link rel="stylesheet" href="/assets/99club/games-new-puzzles-v197-fix.css?v=2">'
              if anchor not in s: raise SystemExit('play CSS anchor not found')
              s=s.replace(anchor,anchor+'\n'+css)
          js='<script src="/assets/99club/games-play-context-keypad-v200.js?v=1"></script>'
          if js not in s:
              anchor='<script src="/assets/99club/games-play-mobile-balance-fix-v197.js?v=3"></script>'
              if anchor not in s: raise SystemExit('play JS anchor not found')
              s=s.replace(anchor,anchor+'\n'+js)
          play.write_text(s)

          games=Path('_pages/99-club-games.md')
          s=games.read_text()
          qa='<script src="/assets/99club/games-brokencalc-quality-v152.js?v=2"></script>'
          if qa not in s:
              anchor='<script src="/assets/99club/games-arithmetic.js?v=6"></script>'
              if anchor not in s: raise SystemExit('games engine anchor not found')
              s=s.replace(anchor,anchor+'\n'+qa)
          games.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check assets/99club/games-brokencalc-quality-v152.js
          node --check assets/99club/games-play-brokencalc-v1.js
          node --check assets/99club/games-play-context-keypad-v200.js
      - name: Commit finalized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tt99-precedence-keypad-finalize.yml
          git add _pages/99-club-games-play.md _pages/99-club-games.md
          git commit -m "Finalize calculator precedence and mobile keypad UX"
          git push origin master
