name: Temporary Online Play v1.76 check

on:
  push:
    branches:
      - fix/arith-crossnumber-share-v176

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/99club/games-play-share-v176-fix.js
      - name: v1.76 regression guards
        run: |
          grep -q 'tt99-arith-link.is-entry' assets/99club/games-play-mobile-polish-v176.css
          grep -q 'width:39px!important' assets/99club/games-play-mobile-polish-v176.css
          grep -q 'tt99-crossnumber-cell small' assets/99club/games-play-mobile-polish-v176.css
          grep -q 'font-size:clamp(.62rem,2.6vw,.8rem)!important' assets/99club/games-play-mobile-polish-v176.css
          grep -q 'display:flex!important' assets/99club/games-play-mobile-polish-v176.css
          grep -q 'freezeSolvedStructureValues' assets/99club/games-play-share-v176-fix.js
          grep -q 'data-share-card' assets/99club/games-play-share-v176-fix.js
          grep -q 'games-play-mobile-polish-v176.css?v=1' _pages/99-club-games-play.md
          grep -q 'games-play-share-v176-fix.js?v=1' _pages/99-club-games-play.md
