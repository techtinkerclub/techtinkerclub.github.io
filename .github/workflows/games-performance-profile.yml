name: Games performance profile
on:
  push:
    branches: [chatgpt/games-performance]
  workflow_dispatch: {}
concurrency:
  group: games-performance-profile
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/99club/games-performance-v142.js
          node --check assets/99club/tests/games-performance-v142-smoke.js
          node --check assets/99club/tests/games-performance-profile.js
      - name: Performance contracts
        run: node assets/99club/tests/games-performance-v142-smoke.js
      - name: Current puzzle regressions
        run: |
          node assets/99club/tests/games-random-pack-smoke.js
          node assets/99club/tests/games-number-logic-smoke.js
          node assets/99club/tests/games-v137-number-towers-smoke.js
          node assets/99club/tests/games-v139-takuzu-smoke.js
          node assets/99club/tests/games-v140-puzzle-pack-smoke.js
          node assets/99club/tests/games-v141-alphametics-smoke.js
      - name: Profile puzzle generation
        run: node assets/99club/tests/games-performance-profile.js
