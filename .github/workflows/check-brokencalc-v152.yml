name: Check Broken Calculator v1.52

on:
  push:
    branches:
      - fix/broken-calculator-division-solvability

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check assets/99club/games-brokencalc-quality-v152.js
          node --check assets/99club/games-play-brokencalc-v1.js
      - name: Validate reachability and division behavior
        run: |
          node <<'NODE'
          global.localStorage=undefined;
          require('./assets/99club/games-arithmetic.js');
          require('./assets/99club/games-brokencalc-quality-v152.js');
          const A=global.TT99ArithmeticGames,Q=A.BROKENCALC_QUALITY;
          if(!Q)throw new Error('Broken Calculator quality guard missing');
          const diffs=['easy','standard','challenge'];
          let total=0,targets=0,challengeDivision=0;
          for(const difficulty of diffs)for(let i=0;i<150;i++){
            const level=difficulty==='easy'?2:difficulty==='challenge'?6:4;
            const settings={minYear:1,maxYear:level,topics:['calculation'],engineSettings:{brokencalc:{difficulty,targets:'3',keyLevel:'auto'}}};
            const p=A.generate('brokencalc',settings,`bc152:${difficulty}:${i}`);
            if(p.error)throw new Error(`${difficulty}/${i}: ${p.error}`);
            const v=A.validate(p);if(!v.ok)throw new Error(`${difficulty}/${i}: ${v.error}`);
            const q=Q.verify(p);if(!q.ok)throw new Error(`${difficulty}/${i}: ${q.error}`);
            for(const t of p.targets){if(!Q.reachable(t.target,p))throw new Error(`${difficulty}/${i}: target ${t.target} unreachable`);targets++;}
            if(difficulty==='challenge'&&p.keys.includes('÷'))challengeDivision++;
            if(difficulty!=='challenge'&&p.keys.includes('÷'))throw new Error(`${difficulty}/${i}: division unexpectedly working`);
            total++;
          }
          if(challengeDivision!==150)throw new Error(`Challenge division working in ${challengeDivision}/150 puzzles`);
          console.log(`validated ${total} puzzles / ${targets} targets; challenge division ${challengeDivision}/150`);
          const fs=require('fs'),src=fs.readFileSync('assets/99club/games-play-brokencalc-v1.js','utf8');
          if(!src.includes("'7','8','9','÷'"))throw new Error('division key is not in keypad');
          if(!src.includes("OPS.includes(k)"))throw new Error('division/operator input handler not generalized');
          console.log('keypad division contracts passed');
          NODE
